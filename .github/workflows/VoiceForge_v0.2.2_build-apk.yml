          const presetData=[["深沉克制","低沉、稳、少炫技，情绪藏在字后面。"],["机智勇敢","节奏明快，判断果断，带一点锋利和幽默。"],["深情慈悲","温暖、悲悯、有呼吸感，不煽情但能打动人。"],["嚣张跋扈","强势、压迫、带挑衅感，句尾有控制力。"],["风流倜傥","松弛、自信、潇洒，带一点漫不经心的魅力。"],["雄浑壮烈","宽阔、燃、厚重，有史诗感和向前推进的力量。"]];
          let selected="深沉克制",recording=false;const params={intensity:75,speed:0.95,pause:55,warmth:50,power:70};
          function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===id));scrollTo(0,0);refreshState()}
          function buildStyles(){document.getElementById('styles').innerHTML=presetData.map(([n,d])=>`<div class="style ${n===selected?'active':''}" onclick="selected='${n}';buildStyles()"><b>${n}</b><p>${d}</p></div>`).join('')}
          function slider(name,label,min,max,step){return `<label class="range"><div class="rangehead"><span>${label}</span><span id="${name}v">${params[name]}</span></div><input type="range" min="${min}" max="${max}" step="${step}" value="${params[name]}" oninput="params.${name}=+this.value;document.getElementById('${name}v').textContent=this.value"></label>`}
          document.getElementById('sliders').innerHTML=slider('intensity','风格强度',0,100,1)+slider('speed','语速',0.7,1.3,0.01)+slider('pause','停顿',0,100,1)+slider('warmth','情绪温度',0,100,1)+slider('power','声音力量',0,100,1);buildStyles();
          const script=document.getElementById('script');script.addEventListener('input',()=>{const n=script.value.replace(/\s/g,'').length;document.getElementById('chars').textContent=n+' 字';document.getElementById('eta').textContent='预计 '+(n?Math.max(1,Math.ceil(n/260)):0)+' 分钟'});
          function refreshState(){try{const s=JSON.parse(Android.getState());const k=s.hasKey?'API Key 已配置 ✓':'尚未配置 API Key';for(const id of ['keyState','settingsKeyState']){const e=document.getElementById(id);e.textContent=k;e.className='status '+(s.hasKey?'ok':'warn')}if(s.hasSample){const e=document.getElementById('sampleState');const sec=s.sampleDurationMs?Math.round(s.sampleDurationMs/1000):0;e.textContent='声音样本已准备 ✓ '+(s.sampleName||'')+(sec?' · '+sec+' 秒':'');e.className='status '+(sec&&sec<10?'warn':'ok')}if(s.voiceId){const txt='Voice ID：'+s.voiceId+' · 状态：'+(s.voiceState||'已创建');for(const id of ['cloneState','voiceLibrary']){const e=document.getElementById(id);e.textContent=txt;e.className='status ok'}}}catch(e){}}
          function saveKey(){Android.saveApiKey(document.getElementById('apiKey').value.trim())}window.onApiKeySaved=(ok,msg)=>{document.getElementById('apiKey').value='';alert(msg);refreshState()};function clearKey(){if(confirm('清除本机保存的 API Key？'))Android.clearApiKey()}window.onApiKeyCleared=()=>refreshState();
          function toggleRecord(){if(!document.getElementById('consent').checked){alert('请先确认声音授权。');return}if(!recording)Android.startRecording();else Android.stopRecording()}
          window.onRecordingStarted=()=>{recording=true;document.getElementById('recBtn').textContent='■ 停止录音';document.getElementById('wave').classList.add('recording');document.getElementById('sampleState').textContent='正在录音… 请保持自然声音'};window.onRecordingStopped=(ms)=>{recording=false;document.getElementById('recBtn').textContent='● 重新录音';document.getElementById('wave').classList.remove('recording');const e=document.getElementById('sampleState');e.textContent='样本已保存 · '+Math.round(ms/1000)+' 秒';e.className='status ok';refreshState()};window.onVoiceSampleImported=(name)=>{const e=document.getElementById('sampleState');e.textContent='已导入声音样本：'+name;e.className='status ok';refreshState()};window.onRecordingError=(m)=>alert(m);
          function createVoice(){Android.createVoice(document.getElementById('voiceName').value,document.getElementById('calibration').value,document.getElementById('consent').checked)}window.onCloneProgress=(m)=>{document.getElementById('cloneState').textContent=m};window.onCloneCreated=(id,state)=>{const e=document.getElementById('cloneState');e.textContent='Voice ID 已创建：'+id+' · '+state;e.className='status ok';refreshState()};window.onVoiceState=(state)=>{refreshState();document.getElementById('cloneState').textContent='音色状态：'+state};window.onCloneError=(m)=>{const e=document.getElementById('cloneState');e.textContent=m;e.className='status warn';alert(m)};function deleteVoice(){if(confirm('删除当前私有音色？此操作也会尝试删除云端 Voice ID。'))Android.deleteVoice()}window.onVoiceDeleted=()=>{document.getElementById('cloneState').textContent='还没有 Voice ID';document.getElementById('voiceLibrary').textContent='未建立';refreshState()};
          window.onDocumentImported=(name,text)=>{script.value=text;script.dispatchEvent(new Event('input'));document.getElementById('docInfo').textContent='已导入：'+name+' · '+text.length+' 字符';go('studio')};window.onImportError=(m)=>alert(m);
          function generate(preview){const t=script.value.trim();if(!t){alert('请先导入或粘贴文字');return}document.getElementById('bar').style.width='2%';document.getElementById('genState').textContent='正在提交生成…';Android.synthesize(t,selected,params.intensity,params.speed,params.pause,params.warmth,params.power,preview)}window.onGenerationProgress=(done,total,msg)=>{document.getElementById('genState').textContent=msg+' / '+total;document.getElementById('bar').style.width=Math.max(4,Math.round((done-1)/total*100))+'%'};window.onGenerationComplete=(count,preview)=>{const e=document.getElementById('genState');e.textContent='生成完成 · '+count+' 段 · 正在播放';e.className='status ok';document.getElementById('bar').style.width='100%'};window.onGenerationError=(m)=>{const e=document.getElementById('genState');e.textContent=m;e.className='status warn';document.getElementById('bar').style.width='0';alert(m)};window.onPlaybackStarted=(i,total)=>{document.getElementById('genState').textContent='正在播放 '+i+' / '+total};window.onPlaybackFinished=()=>{const e=document.getElementById('genState');e.textContent='播放完成 ✓';e.className='status ok'};
          refreshState();
          </script></body></html>
          EOF_HTML

          cat > app/src/main/res/values/strings.xml <<'EOF_STRINGS'
          <?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">声魄 VoiceForge</string></resources>
          EOF_STRINGS

          cat > app/src/main/res/values/styles.xml <<'EOF_STYLES'
          <?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:windowActionModeOverlay">true</item><item name="android:colorAccent">#A92725</item><item name="android:statusBarColor">#0B0B0C</item><item name="android:navigationBarColor">#0B0B0C</item><item name="android:windowLightStatusBar">false</item><item name="android:windowBackground">#0B0B0C</item></style></resources>
          EOF_STYLES

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#0B0B0C" android:pathData="M0,0H108V108H0Z"/><path android:fillColor="#D8B77A" android:pathData="M19,55 C27,55 28,35 35,35 C43,35 43,74 51,74 C59,74 59,25 67,25 C75,25 75,60 83,60 C88,60 89,52 91,48 L91,67 C86,72 80,73 75,69 C69,64 70,46 67,46 C64,46 65,87 51,87 C37,87 38,48 35,48 C32,48 32,64 19,64 Z"/><path android:fillColor="#9E2625" android:pathData="M52,10 C61,24 61,33 55,40 C70,37 77,28 73,17 C87,32 85,51 71,59 C64,63 60,68 58,76 C51,67 44,63 40,56 C32,43 37,24 52,10 Z"/>
          </vector>
          EOF_ICON

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1); fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VoiceForge-v0.2.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceForge-v0.2.2-APK
          path: dist/VoiceForge-v0.2.2.apk
          if-no-files-found: error
          retention-days: 30
