name: Football detection split

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/football_detect_split.yml"

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: A_2021
            id: 1bHMNMsWMJkOq0iXOi1hbgCCTJuZJQmwj
            size: 1529904639
            ss: 0
            dur: 300
