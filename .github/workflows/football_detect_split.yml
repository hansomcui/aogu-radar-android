          - name: B_2104
            id: 1RB6uh6EvUf7-6qEW0u0RqMXvvO7weBpN
            size: 1336780636
            ss: 1800
            dur: 300
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q gdown ultralytics opencv-python-headless
      - name: Download video read-only
        run: |
          set -euo pipefail
          gdown --fuzzy "https://drive.google.com/file/d/${{ matrix.id }}/view" -O v.mp4 || curl -fL -o v.mp4 "https://drive.usercontent.google.com/download?id=${{ matrix.id }}&export=download&confirm=t"
          test $(stat -c%s v.mp4) -eq ${{ matrix.size }}
      - name: Detect at 6 fps
        run: |
          set -euo pipefail
          cat > det.py <<'PY'
          import cv2, sys, json, time
          from ultralytics import YOLO
          m = YOLO("yolov8s.pt")
          cap = cv2.VideoCapture("v.mp4")
          SS = float(sys.argv[1]); END = SS + float(sys.argv[2])
          cap.set(cv2.CAP_PROP_POS_MSEC, max(0.0, SS - 1.0) * 1000.0)
          out = open("det.jsonl", "w")
          step = 1/6.0; nxt = SS; n = 0; t0 = time.time()
          while True:
              ok = cap.grab()
              if not ok: break
              t = cap.get(cv2.CAP_PROP_POS_MSEC)/1000.0
              if t > END: break
              if t + 1e-6 < nxt: continue
              nxt += step
              ok, fr = cap.retrieve()
              if not ok: continue
              r = m.predict(fr, imgsz=1280, conf=0.08, classes=[0,32], verbose=False)[0]
              b = r.boxes
              dets = [[int(c), round(float(s),3)] + [round(float(v),1) for v in xyxy] for c, s, xyxy in zip(b.cls.tolist(), b.conf.tolist(), b.xyxy.tolist())]
              out.write(json.dumps({"t": round(t,3), "d": dets}) + "\n")
              n += 1
              if n % 1000 == 0: print(n, round(t), round(time.time()-t0), flush=True)
          out.close(); print("done", n)
          PY
          python3 det.py ${{ matrix.ss }} ${{ matrix.dur }}
          ls -l det.jsonl
      - name: Encrypt and push
        run: |
          set -euo pipefail
          cat > pub.pem <<'EOF_PUB'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA26GC7C/lhmLEK7kXgiP8
          9Q8WYcA5AHWQbqJpZ9O2Wk7cUvISdp0jLpO+2QfazclOtpckiLlvmHAXT9m8EDB7
          IY5ugxgrgrz4MydObXVqzNNmZfIuEUfkXES3srqSUiu6VBr3ZVWyyhByWWpSWU42
          YJhgja3vwM+t2cfrfqSkSlEfVjDa7jjHTJXuByx8GOjQYK7P/J9GozmKNB/lNtRe
          baDwMNf55GGTZoHnnh30peITWudofMM6IDFDiFwuGYC4dR24dUt93H5iJiFq+7tb
          60mbK2kCiSXofWzF3C2vsNWQvMaDFIs/URjwd/16hRnP1K7P7ScDP+HrFHtedIfL
          d1ksLh9yuEV1f1Tz2kXYCwLu2QCMyXa7LbJNOIDs9MOw6kqDdIs02lN8pnnBBABW
          tq8o9fr3MqDnh1vPs+3k/m4xcUK6YsnDgtxjQMfhur/bbGxhNIt9rFfnBSeE3QkP
          fuD+ExI9mTI9y0clUekwBcy59TrYTJX/JC1DLC4TmIC8I8Re5zI6EO2pmj2AL4yO
          fchFBKmiK/do6nf991/cfca7ObnaGkbUf8A8PA5zxW0lvWG4mm/ky6mRzIT50Iue
          eo3TeXjb4YKso4jfYvS3FxjlAbZIu79bcxxfb1dUijMUvXWxHbZUBaAeN0Owb2D8
          5lcZR9+iUHFT7l6kGpiJJ20CAwEAAQ==
          -----END PUBLIC KEY-----
          EOF_PUB
          sed -i 's/^ *//' pub.pem
          mkdir -p enc
          head -c 32 /dev/urandom | xxd -p -c 64 > key.hex
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in key.hex -out enc/key.bin
          gzip -9 det.jsonl
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:key.hex -in det.jsonl.gz -out enc/det.bin
          rm -f key.hex
          cd enc && git init -q -b det-${{ matrix.name }}-${{ matrix.ss }}
          git config user.name "voiceforge-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "encrypted detections"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" det-${{ matrix.name }}-${{ matrix.ss }}
