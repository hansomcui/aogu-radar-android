name: Publish VoiceForge APK to Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/VoiceForge_publish-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_RUN: "38240193661"
      TAG: "voiceforge-v0.3.5.6"
      APK_NAME: "VoiceForge-v0.3.5.6.apk"
    steps:
      - name: Download APK artifact from build run
        run: |
          set -euo pipefail
          gh run download "$SRC_RUN" -R "$GITHUB_REPOSITORY" -n VoiceForge-v0.3.5.6-IMPORT-DIALOG-APK -D dl
          find dl -type f -exec ls -l {} \;
          apk=$(find dl -name '*.apk' | head -n1)
          test -n "$apk"
          cp "$apk" "$APK_NAME"
          sha256sum "$APK_NAME"
      - name: Create release
        run: |
          set -euo pipefail
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK_NAME" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "声魄 VoiceForge v0.3.5.6" \
            --notes "离线中英文声音克隆。v0.3.5.6：导入音色改为大文本框粘贴参考文字。构建来源 run $SRC_RUN。"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[]|.name+" "+(.size|tostring)+" "+.url'
