      - name: Prebuild Android
        shell: bash
        run: |
          set -euo pipefail

          cd voiceforge-v04

          npx expo prebuild \
            --platform android \
            --clean \
            --non-interactive

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text()

          if 'android:allowBackup=' in s:
              s = re.sub(
                  r'android:allowBackup="[^"]*"',
                  'android:allowBackup="false"',
                  s
              )
          else:
              s = s.replace(
                  '<application',
                  '<application android:allowBackup="false"',
                  1
              )

          p.write_text(s)
          PY

      - name: Verify v0.4 source
        shell: bash
        run: |
          set -euo pipefail

          cd voiceforge-v04

          grep -q \
            'TTS_T3_MULTILINGUAL_CHATTERBOX_Q4_0' \
            App.js

          grep -q \
            'TTS_S3GEN_MULTILINGUAL_CHATTERBOX_Q4_0' \
            App.js

          grep -q \
            'TTS_CANGJIE_ZH_CHATTERBOX' \
            App.js

          grep -q \
            'referenceAudioSrc' \
            App.js

          grep -q \
            "zh','en','ar" \
            App.js

          grep -q \
            'bufferStream' \
            App.js

          grep -q \
            'cancel({' \
            App.js

          grep -q \
            'FileMode.ReadWrite' \
            App.js

          grep -q \
            'allowBackup="false"' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            '@qvac/sdk/tts-ggml/plugin' \
            qvac.config.json

          ! grep -q \
            'zipvoice' \
            App.js

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd voiceforge-v04/android

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=voiceforge-v04/android/app/build/outputs/apk/debug/app-debug.apk

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          unzip -l \
            "$APK" \
            | grep -q \
              'lib/arm64-v8a/'

          mkdir -p dist

          cp \
            "$APK" \
            dist/VoiceForge-v0.4-TRILINGUAL.apk

          sha256sum \
            dist/VoiceForge-v0.4-TRILINGUAL.apk \
            | tee \
              dist/SHA256.txt

          ls -lh \
            dist/VoiceForge-v0.4-TRILINGUAL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceForge-v0.4-TRILINGUAL-APK
          path: |
            dist/VoiceForge-v0.4-TRILINGUAL.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
