name: Build VoiceForge v0.4 Trilingual APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/VoiceForge_v0.4_trilingual_build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Create VoiceForge v0.4 project
        shell: bash
        run: |
          set -euo pipefail

          npx --yes create-expo-app@latest voiceforge-v04 --template blank --yes
          cd voiceforge-v04

          npx expo install \
            expo-audio \
            expo-file-system \
            expo-document-picker \
            expo-sharing \
            expo-build-properties \
            expo-device

          npm install --save-exact \
            @qvac/sdk@0.20.1 \
            @qvac/tts-ggml@0.10.1 \
            @qvac/tts-ggml-android-arm64@0.10.1 \
            react-native-bare-kit@0.15.5

          npm install -D --save-exact bare-pack@2.0.1

          cat > qvac.config.json <<'EOF_QVAC'
          {
            "plugins": [
              "@qvac/sdk/tts-ggml/plugin"
            ]
          }
          EOF_QVAC

          cat > app.json <<'EOF_JSON'
          {
            "expo": {
              "name": "声魄 VoiceForge 三语",
              "slug": "voiceforge-trilingual",
              "version": "0.4.0",
              "orientation": "portrait",
              "userInterfaceStyle": "dark",
              "android": {
                "package": "com.hansom.voiceforge.trilingual",
                "versionCode": 40,
                "allowBackup": false,
                "permissions": [
                  "RECORD_AUDIO",
                  "INTERNET"
                ]
              },
              "plugins": [
                [
                  "expo-build-properties",
                  {
                    "android": {
                      "minSdkVersion": 29,
                      "compileSdkVersion": 35,
                      "targetSdkVersion": 35
                    }
                  }
                ],
                [
                  "expo-audio",
                  {
                    "microphonePermission": "允许声魄录制参考声音。参考声音仅保存在本机。"
                  }
                ],
                [
                  "@qvac/sdk/expo-plugin",
                  {
                    "installMissingPrebuilds": true
                  }
                ]
              ]
            }
          }
          EOF_JSON

          cat > App.js <<'EOF_APP'
          import React, {
            useEffect,
            useMemo,
            useRef,
            useState
          } from 'react';

          import {
            ActivityIndicator,
            Alert,
            Pressable,
            SafeAreaView,
            ScrollView,
            StyleSheet,
            Text,
            TextInput,
            View
          } from 'react-native';

          import {
            createAudioPlayer,
            requestRecordingPermissionsAsync,
            setAudioModeAsync,
            useAudioStream
          } from 'expo-audio';

          import {
            Directory,
            File,
            FileMode,
            Paths
          } from 'expo-file-system';

          import * as Sharing from 'expo-sharing';

          import {
            cancel,
            loadModel,
            setSDKConfig,
            textToSpeech,
            unloadModel,
            TTS_T3_MULTILINGUAL_CHATTERBOX_Q4_0,
            TTS_S3GEN_MULTILINGUAL_CHATTERBOX_Q4_0,
            TTS_CANGJIE_ZH_CHATTERBOX
          } from '@qvac/sdk';


          const SAMPLE_RATE = 24000;

          const REF_TEXT =
            '今天我用自己最自然的声音录下这段参考音。' +
            '以后请保持我的音色、呼吸和说话习惯。' +
            'This is my natural speaking voice.';


          const LANG = {
            auto: '自动识别',
            zh: '中文',
            en: 'English',
            ar: 'العربية'
          };


          const STYLE = {
            deep: {
              name: '深沉克制',
              speed: 0.88,
              exaggeration: 0.20,
              cfgWeight: 0.40
            },

            brave: {
              name: '机智勇敢',
              speed: 1.08,
              exaggeration: 0.70,
              cfgWeight: 0.50
            },

            kind: {
              name: '深情慈悲',
              speed: 0.92,
              exaggeration: 0.55,
              cfgWeight: 0.50
            },

            proud: {
              name: '嚣张跋扈',
              speed: 0.98,
              exaggeration: 0.90,
              cfgWeight: 0.65
            },

            elegant: {
              name: '风流倜傥',
              speed: 1.05,
              exaggeration: 0.65,
              cfgWeight: 0.45
            },

            heroic: {
              name: '雄浑壮烈',
              speed: 0.88,
              exaggeration: 1.00,
              cfgWeight: 0.70
            }
          };


          function detectLanguage(text) {
            let zh = 0;
            let en = 0;
            let ar = 0;
            let foreign = 0;

            for (const ch of text) {
              const cp = ch.codePointAt(0);

              if (
                (cp >= 0x3400 && cp <= 0x4dbf) ||
                (cp >= 0x4e00 && cp <= 0x9fff)
              ) {
                zh++;
                continue;
              }

              if (
                (cp >= 0x0600 && cp <= 0x06ff) ||
                (cp >= 0x0750 && cp <= 0x077f) ||
                (cp >= 0x08a0 && cp <= 0x08ff) ||
                (cp >= 0xfb50 && cp <= 0xfdff) ||
                (cp >= 0xfe70 && cp <= 0xfeff)
              ) {
                ar++;
                continue;
              }

              if (
                (cp >= 65 && cp <= 90) ||
                (cp >= 97 && cp <= 122)
              ) {
                en++;
                continue;
              }

              if (
                (cp >= 0x0370 && cp <= 0x052f) ||
                (cp >= 0x0900 && cp <= 0x0d7f)
              ) {
                foreign++;
              }
            }

            const best = Math.max(zh, en, ar);

            if (best === 0) {
              return 'unsupported';
            }

            if (foreign > best) {
              return 'unsupported';
            }

            if (ar === best) return 'ar';
            if (zh === best) return 'zh';

            return 'en';
          }


          function splitText(text, max = 260) {
            const cleaned = text
              .replace(/\r/g, '')
              .trim();

            if (!cleaned) return [];

            const result = [];
            let current = '';

            const sentences =
              cleaned.match(
                /[^。！？!?；;\n]+[。！？!?；;\n]?/g
              ) || [cleaned];

            function flush() {
              const s = current.trim();

              if (s) {
                result.push(s);
              }

              current = '';
            }

            for (let sentence of sentences) {
              sentence = sentence.trim();

              if (!sentence) {
                continue;
              }

              if (sentence.length > max) {
                flush();

                let rest = sentence;

                while (rest.length > max) {
                  let cut = -1;

                  for (
                    let i = max;
                    i >= Math.floor(max * 0.55);
                    i--
                  ) {
                    if (
                      '：:——，,、'.includes(rest[i])
                    ) {
                      cut = i + 1;
                      break;
                    }
                  }

                  if (cut < 0) {
                    cut = max;
                  }

                  result.push(
                    rest
                      .slice(0, cut)
                      .trim()
                  );

                  rest =
                    rest
                      .slice(cut)
                      .trim();
                }

                if (rest) {
                  result.push(rest);
                }

                continue;
              }

              if (
                !current ||
                current.length + sentence.length <= max
              ) {
                current += sentence;
              } else {
                flush();
                current = sentence;
              }
            }

            flush();

            return result;
          }


          function createWavHeader(
            dataLength,
            sampleRate
          ) {
            const bytes =
              new Uint8Array(44);

            const view =
              new DataView(bytes.buffer);

            const writeText =
              (offset, text) => {
                for (
                  let i = 0;
                  i < text.length;
                  i++
                ) {
                  bytes[offset + i] =
                    text.charCodeAt(i);
                }
              };

            writeText(0, 'RIFF');

            view.setUint32(
              4,
              36 + dataLength,
              true
            );

            writeText(8, 'WAVE');
            writeText(12, 'fmt ');

            view.setUint32(
              16,
              16,
              true
            );

            view.setUint16(
              20,
              1,
              true
            );

            view.setUint16(
              22,
              1,
              true
            );

            view.setUint32(
              24,
              sampleRate,
              true
            );

            view.setUint32(
              28,
              sampleRate * 2,
              true
            );

            view.setUint16(
              32,
              2,
              true
            );

            view.setUint16(
              34,
              16,
              true
            );

            writeText(36, 'data');

            view.setUint32(
              40,
              dataLength,
              true
            );

            return bytes;
          }


          function samplesToBytes(samples) {
            const bytes =
              new Uint8Array(
                samples.length * 2
              );

            const view =
              new DataView(
                bytes.buffer
              );

            for (
              let i = 0;
              i < samples.length;
              i++
            ) {
              const value =
                Math.max(
                  -32768,
                  Math.min(
                    32767,
                    Math.round(
                      samples[i] || 0
                    )
                  )
                );

              view.setInt16(
                i * 2,
                value,
                true
              );
            }

            return bytes;
          }


          function nativePath(uri) {
            return decodeURIComponent(
              uri.replace(
                /^file:\/\//,
                ''
              )
            );
          }


          function checkReference(
            chunks,
            sampleRate
          ) {
            let samples = 0;
            let sum = 0;
            let silence = 0;
            let clipped = 0;
            let peak = 0;

            for (const chunk of chunks) {
              const view =
                new DataView(
                  chunk.buffer,
                  chunk.byteOffset,
                  chunk.byteLength
                );

              for (
                let i = 0;
                i + 1 < chunk.byteLength;
                i += 2
              ) {
                const sample =
                  view.getInt16(
                    i,
                    true
                  );

                const abs =
                  Math.abs(sample);

                samples++;

                sum +=
                  sample * sample;

                if (abs < 250) {
                  silence++;
                }

                if (abs > 32300) {
                  clipped++;
                }

                if (abs > peak) {
                  peak = abs;
                }
              }
            }

            const duration =
              samples / sampleRate;

            const rms =
              samples > 0
                ? Math.sqrt(
                    sum / samples
                  ) / 32768
                : 0;

            const silenceRatio =
              samples
                ? silence / samples
                : 1;

            const clippingRatio =
              samples
                ? clipped / samples
                : 0;

            if (duration < 6) {
              return {
                ok: false,
                message:
                  '参考音至少需要 6 秒。'
              };
            }

            if (duration > 22) {
              return {
                ok: false,
                message:
                  '参考音太长，建议控制在 8–15 秒。'
              };
            }

            if (rms < 0.025) {
              return {
                ok: false,
                message:
                  '声音太小或接近静音。'
              };
            }

            if (silenceRatio > 0.62) {
              return {
                ok: false,
                message:
                  '静音比例过高，请连续自然朗读。'
              };
            }

            if (clippingRatio > 0.015) {
              return {
                ok: false,
                message:
                  '爆音过多，请稍微离麦克风远一点。'
              };
            }

            if (peak < 2500) {
              return {
                ok: false,
                message:
                  '录音动态范围不足。'
              };
            }

            return {
              ok: true,
              duration
            };
          }


          export default function App() {
            const [text, setText] =
              useState('');

            const [lang, setLang] =
              useState('auto');

            const [styleKey, setStyleKey] =
              useState('deep');

            const [reference, setReference] =
              useState(null);

            const [recording, setRecording] =
              useState(false);

            const [busy, setBusy] =
              useState(false);

            const [status, setStatus] =
              useState(
                '请先录制参考声音'
              );

            const [progress, setProgress] =
              useState(0);

            const [works, setWorks] =
              useState([]);

            const modelRef =
              useRef(null);

            const modelKeyRef =
              useRef(null);

            const requestRef =
              useRef(null);

            const cancelRef =
              useRef(false);

            const playerRef =
              useRef(null);

            const recordChunks =
              useRef([]);

            const recordRate =
              useRef(SAMPLE_RATE);


            const worksDir =
              useMemo(
                () =>
                  new Directory(
                    Paths.document,
                    'VoiceForgeWorks'
                  ),
                []
              );


            const privateDir =
              useMemo(
                () =>
                  new Directory(
                    Paths.document,
                    'VoiceForgePrivate'
                  ),
                []
              );


            const audioStream =
              useAudioStream({
                sampleRate:
                  SAMPLE_RATE,

                channels:
                  1,

                encoding:
                  'int16',

                onBuffer:
                  buffer => {
                    recordRate.current =
                      buffer.sampleRate ||
                      SAMPLE_RATE;

                    recordChunks.current.push(
                      new Uint8Array(
                        buffer.data.slice(0)
                      )
                    );
                  }
              });


            const reloadHistory =
              () => {
                try {
                  if (!worksDir.exists) {
                    worksDir.create({
                      intermediates: true,
                      idempotent: true
                    });
                  }

                  setWorks(
                    worksDir
                      .list()
                      .filter(
                        file =>
                          file instanceof File &&
                          file.name.endsWith(
                            '.wav'
                          )
                      )
                      .sort(
                        (a, b) =>
                          (b.lastModified || 0) -
                          (a.lastModified || 0)
                      )
                  );
                } catch (_) {}
              };


            useEffect(
              () => {
                setSDKConfig({
                  registryDownloadMaxRetries:
                    5,

                  registryStreamTimeoutMs:
                    180000
                });

                if (!worksDir.exists) {
                  worksDir.create({
                    intermediates: true,
                    idempotent: true
                  });
                }

                if (!privateDir.exists) {
                  privateDir.create({
                    intermediates: true,
                    idempotent: true
                  });
                }

                reloadHistory();

                return () => {
                  cancelRef.current =
                    true;

                  if (
                    requestRef.current
                  ) {
                    cancel({
                      requestId:
                        requestRef.current
                    }).catch(() => {});
                  }

                  try {
                    playerRef.current
                      ?.release?.();
                  } catch (_) {}

                  if (modelRef.current) {
                    unloadModel({
                      modelId:
                        modelRef.current
                    }).catch(() => {});
                  }
                };
              },
              []
            );


            async function startRecord() {
              const permission =
                await requestRecordingPermissionsAsync();

              if (!permission.granted) {
                Alert.alert(
                  '需要麦克风权限'
                );

                return;
              }

              await setAudioModeAsync({
                playsInSilentMode:
                  true,

                allowsRecording:
                  true
              });

              recordChunks.current =
                [];

              await audioStream
                .stream
                .start();

              setRecording(true);

              setStatus(
                '正在录音，请自然完整读完参考句'
              );
            }


            async function stopRecord() {
              try {
                audioStream
                  .stream
                  .stop();
              } catch (_) {}

              setRecording(false);

              const result =
                checkReference(
                  recordChunks.current,
                  recordRate.current
                );

              if (!result.ok) {
                Alert.alert(
                  '录音质量不合格',
                  result.message
                );

                setStatus(
                  '请重新录制参考音'
                );

                return;
              }

              const byteCount =
                recordChunks
                  .current
                  .reduce(
                    (sum, item) =>
                      sum +
                      item.byteLength,
                    0
                  );

              const file =
                new File(
                  privateDir,
                  `my-voice-${Date.now()}.wav`
                );

              file.create();

              const handle =
                file.open(
                  FileMode.ReadWrite
                );

              try {
                await handle.writeBytes(
                  createWavHeader(
                    byteCount,
                    recordRate.current
                  )
                );

                for (
                  const chunk of
                  recordChunks.current
                ) {
                  await handle.writeBytes(
                    chunk
                  );
                }
              } finally {
                handle.close();
              }

              setReference(file);

              setStatus(
                `参考音通过质检 · ${result.duration.toFixed(1)} 秒`
              );

              Alert.alert(
                '参考音已保存',
                '中、英、阿三种语言都会使用同一个你的音色。'
              );
            }


            function selectedLanguage(value) {
              if (lang !== 'auto') {
                return lang;
              }

              return detectLanguage(
                value
              );
            }


            async function ensureModel(
              language
            ) {
              if (!reference?.exists) {
                throw new Error(
                  '请先录制参考声音'
                );
              }

              if (
                ![
                  'zh',
                  'en',
                  'ar'
                ].includes(language)
              ) {
                throw new Error(
                  '当前版本只支持中文、英文、阿拉伯语'
                );
              }

              const style =
                STYLE[styleKey];

              const modelKey =
                `${language}:${styleKey}`;

              if (
                modelRef.current &&
                modelKeyRef.current ===
                  modelKey
              ) {
                return modelRef.current;
              }

              if (modelRef.current) {
                setStatus(
                  '正在切换语言/演绎模式…'
                );

                await unloadModel({
                  modelId:
                    modelRef.current
                }).catch(() => {});

                modelRef.current =
                  null;

                modelKeyRef.current =
                  null;
              }

              const baseConfig = {
                ttsEngine:
                  'chatterbox',

                language,

                s3genModelSrc:
                  TTS_S3GEN_MULTILINGUAL_CHATTERBOX_Q4_0,

                referenceAudioSrc:
                  nativePath(
                    reference.uri
                  ),

                cfmSteps:
                  1,

                threads:
                  4,

                nCtx:
                  768,

                maxSentenceChars:
                  300,

                crossfadeMs:
                  30,

                streamChunkTokens:
                  25,

                streamFirstChunkTokens:
                  10,

                ttsSpeed:
                  style.speed,

                exaggeration:
                  style.exaggeration,

                cfgWeight:
                  style.cfgWeight,

                ...(language ===
                'zh'
                  ? {
                      cangjieTsvSrc:
                        TTS_CANGJIE_ZH_CHATTERBOX
                    }
                  : {})
              };


              const load =
                async useGPU =>
                  loadModel({
                    modelType:
                      'tts-ggml',

                    modelSrc:
                      TTS_T3_MULTILINGUAL_CHATTERBOX_Q4_0,

                    modelConfig: {
                      ...baseConfig,
                      useGPU
                    },

                    onProgress:
                      event => {
                        const percentage =
                          Number.isFinite(
                            event
                              ?.percentage
                          )
                            ? Math.round(
                                event
                                  .percentage
                              )
                            : 0;

                        setProgress(
                          percentage
                        );

                        setStatus(
                          `首次下载/加载三语模型 ${percentage}%`
                        );
                      }
                  });


              let id;

              try {
                id =
                  await load(true);
              } catch (_) {
                setStatus(
                  'GPU 不兼容，自动切换 CPU…'
                );

                id =
                  await load(false);
              }


              modelRef.current =
                id;

              modelKeyRef.current =
                modelKey;

              setProgress(100);

              setStatus(
                `${LANG[language]} 引擎已就绪 · ${style.name}`
              );

              return id;
            }


            async function cancelGeneration() {
              cancelRef.current =
                true;

              if (
                requestRef.current
              ) {
                await cancel({
                  requestId:
                    requestRef.current
                }).catch(() => {});
              }

              setStatus(
                '正在取消生成…'
              );
            }


            function stopPlayback() {
              try {
                playerRef.current
                  ?.pause?.();
              } catch (_) {}

              setStatus(
                '已停止播放'
              );
            }


            function play(file) {
              try {
                playerRef.current
                  ?.release?.();
              } catch (_) {}

              const player =
                createAudioPlayer(
                  file.uri
                );

              playerRef.current =
                player;

              player.play();

              setStatus(
                `正在播放：${file.name}`
              );
            }


            async function generate(
              preview
            ) {
              if (busy) return;

              const source =
                text.trim();

              if (!source) {
                Alert.alert(
                  '请先粘贴文字'
                );

                return;
              }

              if (!reference?.exists) {
                Alert.alert(
                  '请先录制参考声音'
                );

                return;
              }

              const wholeLang =
                selectedLanguage(
                  source
                );

              if (
                wholeLang ===
                'unsupported'
              ) {
                Alert.alert(
                  '不支持的语言',
                  'v0.4 只支持中文、英文、阿拉伯语。其他语言不会再导致程序闪退。'
                );

                return;
              }


              setBusy(true);

              cancelRef.current =
                false;

              setProgress(0);


              let output =
                null;

              let handle =
                null;


              try {
                const target =
                  preview
                    ? source.slice(
                        0,
                        220
                      )
                    : source;

                const chunks =
                  splitText(
                    target
                  );

                if (!chunks.length) {
                  throw new Error(
                    '没有可朗读文字'
                  );
                }


                const stamp =
                  new Date()
                    .toISOString()
                    .replace(
                      /[:.]/g,
                      '-'
                    );


                output =
                  new File(
                    worksDir,
                    `VoiceForge-${wholeLang}-${stamp}.wav`
                  );


                output.create();


                handle =
                  output.open(
                    FileMode.ReadWrite
                  );


                await handle.writeBytes(
                  new Uint8Array(44)
                );


                let audioBytes =
                  0;

                let sampleRate =
                  SAMPLE_RATE;


                for (
                  let i = 0;
                  i < chunks.length;
                  i++
                ) {
                  if (
                    cancelRef.current
                  ) {
                    throw new Error(
                      '__CANCELLED__'
                    );
                  }


                  const chunkLang =
                    lang === 'auto'
                      ? detectLanguage(
                          chunks[i]
                        )
                      : lang;


                  if (
                    ![
                      'zh',
                      'en',
                      'ar'
                    ].includes(
                      chunkLang
                    )
                  ) {
                    throw new Error(
                      `第 ${i + 1} 段包含当前不支持的语言`
                    );
                  }


                  const modelId =
                    await ensureModel(
                      chunkLang
                    );


                  setStatus(
                    `生成逻辑段 ${i + 1}/${chunks.length} · ${LANG[chunkLang]}`
                  );


                  setProgress(
                    Math.round(
                      i /
                        chunks.length *
                        100
                    )
                  );


                  const run =
                    textToSpeech({
                      modelId,

                      text:
                        chunks[i],

                      inputType:
                        'text',

                      stream:
                        true
                    });


                  requestRef.current =
                    run.requestId;


                  const rate =
                    await run.sampleRate;


                  if (rate) {
                    sampleRate =
                      rate;
                  }


                  for await (
                    const samples
                    of run.bufferStream
                  ) {
                    if (
                      cancelRef.current
                    ) {
                      await cancel({
                        requestId:
                          run.requestId
                      }).catch(
                        () => {}
                      );

                      throw new Error(
                        '__CANCELLED__'
                      );
                    }


                    const bytes =
                      samplesToBytes(
                        samples
                      );


                    await handle.writeBytes(
                      bytes
                    );


                    audioBytes +=
                      bytes.byteLength;
                  }


                  requestRef.current =
                    null;
                }


                handle.offset =
                  0;


                await handle.writeBytes(
                  createWavHeader(
                    audioBytes,
                    sampleRate
                  )
                );


                handle.close();

                handle =
                  null;


                setProgress(100);

                setStatus(
                  `生成完成 · ${LANG[wholeLang]} · ${STYLE[styleKey].name}`
                );


                reloadHistory();

                play(output);
              } catch (error) {
                try {
                  handle?.close?.();
                } catch (_) {}


                if (
                  output?.exists
                ) {
                  try {
                    await output.delete();
                  } catch (_) {}
                }


                if (
                  String(
                    error?.message ||
                    error
                  ).includes(
                    '__CANCELLED__'
                  )
                ) {
                  setStatus(
                    '已取消生成，旧作品没有被覆盖'
                  );
                } else {
                  setStatus(
                    '生成失败'
                  );

                  Alert.alert(
                    '生成失败',
                    String(
                      error?.message ||
                      error
                    )
                  );
                }
              } finally {
                requestRef.current =
                  null;

                setBusy(false);

                reloadHistory();
              }
            }


            async function save(file) {
              try {
                const directory =
                  await Directory
                    .pickDirectoryAsync();

                if (!directory) {
                  return;
                }

                const target =
                  new File(
                    directory,
                    file.name
                  );

                if (target.exists) {
                  await target.delete();
                }

                await file.copy(
                  target
                );

                Alert.alert(
                  '已保存 WAV',
                  file.name
                );
              } catch (error) {
                Alert.alert(
                  '保存失败',
                  String(
                    error?.message ||
                    error
                  )
                );
              }
            }


            async function share(file) {
              if (
                await Sharing
                  .isAvailableAsync()
              ) {
                await Sharing
                  .shareAsync(
                    file.uri,
                    {
                      mimeType:
                        'audio/wav',

                      dialogTitle:
                        '分享 VoiceForge WAV'
                    }
                  );
              }
            }


