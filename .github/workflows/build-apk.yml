name: Build Yaogu Radar APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/hansom/yaoguradar
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "YaoguRadar"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hansom.yaoguradar'
              compileSdk 34

              defaultConfig {
                  applicationId "com.hansom.yaoguradar"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/hansom/yaoguradar/MainActivity.java <<'EOF'
          package com.hansom.yaoguradar;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends Activity {

              private static final String APP_URL =
                      "https://restless-cloud-ea3c.hansomcui790528.workers.dev/";
              private static final int FILE_CHOOSER_REQUEST = 1001;

              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefresh;
              private LinearLayout offlinePanel;
              private TextView offlineText;
              private ValueCallback<Uri[]> filePathCallback;
              private ConnectivityManager connectivityManager;
              private ConnectivityManager.NetworkCallback networkCallback;
              private boolean mainFrameFailed = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(201, 21, 30));
                  getWindow().setNavigationBarColor(Color.WHITE);

                  buildUi();
                  configureWebView();
                  registerNetworkWatcher();

                  if (savedInstanceState == null) {
                      openHome();
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              private void buildUi() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.WHITE);

                  swipeRefresh = new SwipeRefreshLayout(this);
                  swipeRefresh.setColorSchemeColors(Color.rgb(201, 21, 30));
                  swipeRefresh.setProgressBackgroundColorSchemeColor(Color.WHITE);
                  swipeRefresh.setOnRefreshListener(() -> {
                      hideOfflinePanel();
                      mainFrameFailed = false;
                      if (isOnline()) {
                          webView.reload();
                      } else {
                          swipeRefresh.setRefreshing(false);
                          showOfflinePanel("当前没有网络连接");
                      }
                  });

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.WHITE);
                  swipeRefresh.addView(
                          webView,
                          new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                  progressBar = new ProgressBar(
                          this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);

                  FrameLayout.LayoutParams refreshParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT);

                  FrameLayout.LayoutParams progressParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(3));
                  progressParams.gravity = Gravity.TOP;

                  offlinePanel = new LinearLayout(this);
                  offlinePanel.setOrientation(LinearLayout.VERTICAL);
                  offlinePanel.setGravity(Gravity.CENTER);
                  offlinePanel.setPadding(dp(28), dp(28), dp(28), dp(28));
                  offlinePanel.setBackgroundColor(Color.WHITE);
                  offlinePanel.setVisibility(View.GONE);

                  TextView icon = new TextView(this);
                  icon.setText("⚡");
                  icon.setTextSize(42);
                  icon.setGravity(Gravity.CENTER);

                  TextView title = new TextView(this);
                  title.setText("妖股雷达暂时连不上");
                  title.setTextColor(Color.rgb(35, 35, 35));
                  title.setTextSize(20);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, dp(10), 0, dp(8));

                  offlineText = new TextView(this);
                  offlineText.setTextColor(Color.rgb(110, 110, 110));
                  offlineText.setTextSize(14);
                  offlineText.setGravity(Gravity.CENTER);
                  offlineText.setText("请检查网络后重试");
                  offlineText.setPadding(0, 0, 0, dp(20));

                  Button retry = new Button(this);
                  retry.setText("重新连接");
                  retry.setTextSize(16);
                  retry.setOnClickListener(v -> retryLoad());

                  Button networkSettings = new Button(this);
                  networkSettings.setText("网络设置");
                  networkSettings.setTextSize(14);
                  networkSettings.setOnClickListener(v -> {
                      try {
                          startActivity(new Intent(Settings.ACTION_WIRELESS_SETTINGS));
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_SETTINGS));
                      }
                  });

                  offlinePanel.addView(icon);
                  offlinePanel.addView(title);
                  offlinePanel.addView(offlineText);
                  offlinePanel.addView(
                          retry,
                          new LinearLayout.LayoutParams(dp(190), dp(52)));

                  LinearLayout.LayoutParams settingsParams =
                          new LinearLayout.LayoutParams(dp(190), dp(48));
                  settingsParams.topMargin = dp(8);
                  offlinePanel.addView(networkSettings, settingsParams);

                  FrameLayout.LayoutParams offlineParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT);

                  root.addView(swipeRefresh, refreshParams);
                  root.addView(progressBar, progressParams);
                  root.addView(offlinePanel, offlineParams);
                  setContentView(root);
              }

              private void configureWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setUserAgentString(
                          settings.getUserAgentString() + " YaoguRadarAndroid/1.1");

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setDownloadListener(
                          (url, userAgent, contentDisposition, mimetype, contentLength) ->
                                  openExternal(Uri.parse(url)));

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progressBar.setProgress(newProgress);
                          progressBar.setVisibility(
                                  newProgress >= 100 ? View.GONE : View.VISIBLE);
                          if (newProgress >= 100) {
                              swipeRefresh.setRefreshing(false);
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallbackParam,
                              FileChooserParams fileChooserParams) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = filePathCallbackParam;
                          try {
                              Intent intent = fileChooserParams.createIntent();
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              Toast.makeText(
                                      MainActivity.this,
                                      "无法打开文件选择器",
                                      Toast.LENGTH_SHORT).show();
                              return false;
                          }
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          String host = uri.getHost();

                          if (scheme != null &&
                                  (scheme.equals("tel") ||
                                          scheme.equals("mailto") ||
                                          scheme.equals("sms") ||
                                          scheme.equals("intent"))) {
                              openExternal(uri);
                              return true;
                          }

                          if (host != null &&
                                  (host.equals("restless-cloud-ea3c.hansomcui790528.workers.dev")
                                          || host.endsWith(".workers.dev"))) {
                              return false;
                          }

                          openExternal(uri);
                          return true;
                      }

                      @Override
                      public void onPageStarted(
                              WebView view, String url, android.graphics.Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          if (url != null && url.startsWith(APP_URL)) {
                              mainFrameFailed = false;
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          swipeRefresh.setRefreshing(false);
                          if (!mainFrameFailed) {
                              hideOfflinePanel();
                          }
                      }

                      @Override
                      public void onReceivedError(
                              WebView view,
                              WebResourceRequest request,
                              WebResourceError error) {
                          if (request.isForMainFrame()) {
                              mainFrameFailed = true;
                              swipeRefresh.setRefreshing(false);
                              String message = isOnline()
                                      ? "服务器连接失败，请稍后重试"
                                      : "当前没有网络连接";
                              showOfflinePanel(message);
                          }
                      }
                  });
              }

              private void openHome() {
                  if (isOnline()) {
                      hideOfflinePanel();
                      webView.loadUrl(APP_URL);
                  } else {
                      showOfflinePanel("当前没有网络连接");
                  }
              }

              private void retryLoad() {
                  if (!isOnline()) {
                      showOfflinePanel("当前没有网络连接");
                      Toast.makeText(this, "网络仍未连接", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  hideOfflinePanel();
                  mainFrameFailed = false;
                  swipeRefresh.setRefreshing(true);
                  String current = webView.getUrl();
                  if (current == null ||
                          current.trim().isEmpty() ||
                          current.startsWith("about:")) {
                      webView.loadUrl(APP_URL);
                  } else {
                      webView.reload();
                  }
              }

              private boolean isOnline() {
                  ConnectivityManager cm = (ConnectivityManager)
                          getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm == null) return false;
                  Network network = cm.getActiveNetwork();
                  if (network == null) return false;
                  NetworkCapabilities caps = cm.getNetworkCapabilities(network);
                  return caps != null &&
                          caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET);
              }

              private void registerNetworkWatcher() {
                  connectivityManager = (ConnectivityManager)
                          getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (connectivityManager == null) return;

                  networkCallback = new ConnectivityManager.NetworkCallback() {
                      @Override
                      public void onAvailable(Network network) {
                          runOnUiThread(() -> {
                              if (offlinePanel.getVisibility() == View.VISIBLE || mainFrameFailed) {
                                  retryLoad();
                              }
                          });
                      }

                      @Override
                      public void onLost(Network network) {
                          runOnUiThread(() -> {
                              if (!isOnline()) {
                                  showOfflinePanel("网络连接已断开");
                              }
                          });
                      }
                  };

                  try {
                      connectivityManager.registerDefaultNetworkCallback(networkCallback);
                  } catch (Exception ignored) {
                  }
              }

              private void openExternal(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (Exception e) {
                      Toast.makeText(
                              this,
                              "没有可打开此链接的应用",
                              Toast.LENGTH_SHORT).show();
                  }
              }

              private void showOfflinePanel(String message) {
                  offlineText.setText(message);
                  offlinePanel.setVisibility(View.VISIBLE);
                  progressBar.setVisibility(View.GONE);
              }

              private void hideOfflinePanel() {
                  offlinePanel.setVisibility(View.GONE);
              }

              private int dp(int value) {
                  float density = getResources().getDisplayMetrics().density;
                  return Math.round(value * density);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST && filePathCallback != null) {
                      Uri[] results =
                              WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (offlinePanel != null &&
                          offlinePanel.getVisibility() == View.VISIBLE) {
                      hideOfflinePanel();
                      if (webView.getUrl() == null) {
                          openHome();
                      }
                      return;
                  }

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) {
                      webView.saveState(outState);
                  }
                  super.onSaveInstanceState(outState);
              }

              @Override
              protected void onDestroy() {
                  if (connectivityManager != null && networkCallback != null) {
                      try {
                          connectivityManager.unregisterNetworkCallback(networkCallback);
                      } catch (Exception ignored) {
                      }
                  }

                  if (filePathCallback != null) {
                      filePathCallback.onReceiveValue(null);
                      filePathCallback = null;
                  }

                  if (webView != null) {
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">妖股雷达 V3.1</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#D71920</item>
                  <item name="android:statusBarColor">#C9151E</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#C9151E"
                  android:pathData="M0,0H108V108H0Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M62,8 L25,59 L49,59 L42,100 L84,45 L59,45 Z" />
          </vector>
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/yaogu-radar-v3.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaogu-radar-v3.1-apk
          path: dist/yaogu-radar-v3.1.apk
          if-no-files-found: error
          retention-days: 30
