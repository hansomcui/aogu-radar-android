                  items.forEach { v -> arr.put(JSONObject().apply { put("id",v.id); put("name",v.name); put("referenceText",v.referenceText); put("fileName",v.fileName) }) }
                  prefs.edit().putString("voice_profiles", arr.toString()).apply()
              }


              private fun activeVoiceProfile(): VoiceProfile? {
