                <div id="styles" class="styles"></div>
                <label class="range"><div class="rangehead"><span>风格强度</span><span id="intensityV">75</span></div><input id="intensity" type="range" min="0" max="100" value="75" oninput="intensityV.textContent=this.value"></label>
          
                <div class="row" style="margin-top:16px">
