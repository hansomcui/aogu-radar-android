      - name: Download sherpa-onnx Android runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 -o app/libs/sherpa-onnx-1.13.8.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          test -s app/libs/sherpa-onnx-1.13.8.aar
          ls -lh app/libs/sherpa-onnx-1.13.8.aar


      - name: Download and embed ZipVoice offline model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/voiceforge-model app/src/main/assets/zipvoice
          curl -fL --retry 5 --retry-delay 3 -o /tmp/zipvoice.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia.tar.bz2"
          tar -xjf /tmp/zipvoice.tar.bz2 -C /tmp/voiceforge-model
          MODEL_DIR=/tmp/voiceforge-model/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia
          test -d "$MODEL_DIR"
          rm -rf "$MODEL_DIR/test_wavs" || true
          cp -a "$MODEL_DIR/." app/src/main/assets/zipvoice/
          curl -fL --retry 5 --retry-delay 3 -o app/src/main/assets/zipvoice/vocos_24khz.onnx "https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos_24khz.onnx"
          test -s app/src/main/assets/zipvoice/encoder.int8.onnx
          test -s app/src/main/assets/zipvoice/decoder.int8.onnx
          test -s app/src/main/assets/zipvoice/vocos_24khz.onnx
          test -s app/src/main/assets/zipvoice/tokens.txt
          test -s app/src/main/assets/zipvoice/lexicon.txt
          test -d app/src/main/assets/zipvoice/espeak-ng-data
          echo 'Model payload:'
          du -sh app/src/main/assets/zipvoice


      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1); fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      - name: Verify v0.3.5 source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fun cancelGeneration()' app/src/main/java/com/hansom/voiceforge/MainActivity.kt
          grep -q 'generateWithConfigAndCallback' app/src/main/java/com/hansom/voiceforge/MainActivity.kt
          grep -q 'inspectPcm16Wav' app/src/main/java/com/hansom/voiceforge/MainActivity.kt
          grep -q 'fun listWorks()' app/src/main/java/com/hansom/voiceforge/MainActivity.kt
          grep -q 'analyzeRecordingQuality' app/src/main/java/com/hansom/voiceforge/MainActivity.kt
          grep -q 'fun importVoice' app/src/main/java/com/hansom/voiceforge/MainActivity.kt
          grep -q 'fun selectVoice' app/src/main/java/com/hansom/voiceforge/MainActivity.kt
          grep -q '音色库' app/src/main/assets/index.html
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'dataExtractionRules' app/src/main/AndroidManifest.xml
          grep -q '取消生成' app/src/main/assets/index.html
          grep -q '停止播放' app/src/main/assets/index.html


      - name: Build offline APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug


      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test $(stat -c%s "$APK") -gt 150000000
          unzip -l "$APK" | grep -q 'assets/zipvoice/encoder.int8.onnx'
          unzip -l "$APK" | grep -q 'assets/zipvoice/decoder.int8.onnx'
          unzip -l "$APK" | grep -q 'assets/zipvoice/vocos_24khz.onnx'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          mkdir -p dist
          cp "$APK" dist/VoiceForge-v0.3.5.6-IMPORT-DIALOG.apk
          sha256sum dist/VoiceForge-v0.3.5.6-IMPORT-DIALOG.apk | tee dist/SHA256.txt
          ls -lh dist/VoiceForge-v0.3.5.6-IMPORT-DIALOG.apk


      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceForge-v0.3.5.6-IMPORT-DIALOG-APK
          path: |
            dist/VoiceForge-v0.3.5.6-IMPORT-DIALOG.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
