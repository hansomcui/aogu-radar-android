              <div class="hero"><h1>任何参考音色，<br>都留在你的手机里。</h1><p>不用 API，不用电脑。录制自己的声音，或导入你指定的音频（WAV/MP3/MP4）和对应原文，再用当前选中的音色离线朗读。</p></div>
          
              <div class="card">
                <h2>① 本地 AI 引擎</h2>
                <div class="sub">ZipVoice-Distill INT8 + sherpa-onnx，中文/英文零样本声音克隆。</div>
                <div id="engineState" class="status">首次启动：正在准备本地模型</div>
