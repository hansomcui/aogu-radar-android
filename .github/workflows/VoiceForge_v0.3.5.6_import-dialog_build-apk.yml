              private class GenerationCancelledException : RuntimeException()
          
              private fun safeWorkFile(name: String?): File? {
                  if (name.isNullOrBlank()) return null
                  val f = File(worksDir, name)
                  return runCatching {
                      if (f.canonicalFile.parentFile == worksDir.canonicalFile && f.isFile) f else null
                  }.getOrNull()
              }
          
              private fun openSaveDialog(f: File) {
                  if (generationInProgress) {
                      toast("正在生成，请先等待完成或取消生成")
                      return
                  }
                  try {
                      val info = inspectPcm16Wav(f)
                      check(info.dataSize > 0L) { "WAV 音频数据为空" }
                  } catch (t: Throwable) {
                      toast("WAV 自检失败：" + (t.message ?: t.javaClass.simpleName))
                      return
                  }
          
                  val name = f.name.ifBlank { "VoiceForge-${System.currentTimeMillis()}.wav" }
                  pendingSaveFile = f
                  pendingSaveName = name
                  runOnUiThread {
                      try {
                          val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "audio/wav"
                              putExtra(Intent.EXTRA_TITLE, name)
                              addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          }
                          startActivityForResult(intent, REQ_SAVE_WAV)
                      } catch (t: Throwable) {
                          pendingSaveFile = null
                          pendingSaveName = null
                          toast("无法打开系统保存窗口：" + (t.message ?: t.javaClass.simpleName))
                      }
                  }
              }
          
              private data class StyleCfg(
                  val speed: Float,
                  val silenceScale: Float,
                  val gain: Float,
                  val tone: Float,
                  val chunkGapMs: Int,
                  val numSteps: Int
              )
          
              private fun styleFor(name: String, intensity: Int): StyleCfg {
                  val k = intensity / 100f
                  val target = when (name) {
                      "机智勇敢" -> StyleCfg(1.10f, 0.72f, 1.04f, -0.12f, 90, 4)
                      "深情慈悲" -> StyleCfg(0.90f, 1.18f, 0.96f, 0.18f, 260, 4)
                      "嚣张跋扈" -> StyleCfg(0.96f, 0.72f, 1.13f, -0.08f, 120, 4)
                      "风流倜傥" -> StyleCfg(1.03f, 0.82f, 1.00f, 0.06f, 120, 4)
                      "雄浑壮烈" -> StyleCfg(0.86f, 1.25f, 1.16f, 0.14f, 320, 4)
                      else -> StyleCfg(0.84f, 1.22f, 0.94f, 0.12f, 300, 4)
                  }
                  fun mix(neutral: Float, v: Float) = neutral + (v - neutral) * k
                  return target.copy(
                      speed = mix(1f, target.speed),
                      silenceScale = mix(1f, target.silenceScale),
                      gain = mix(1f, target.gain),
                      tone = target.tone * k,
                      chunkGapMs = (120 + (target.chunkGapMs - 120) * k).toInt()
                  )
              }
          
              private fun transformText(text: String, style: String, intensity: Int): String {
                  if (intensity < 20) return text
                  return when (style) {
                      "机智勇敢" -> text.replace("……", "。").replace("；", "，")
                      "深情慈悲" -> text.replace("！", "。").replace("?", "？")
                      "嚣张跋扈" -> text.replace("。", "！")
                      "风流倜傥" -> text.replace("；", "，")
                      "雄浑壮烈" -> text.replace("；", "。").replace("：", "——")
                      else -> text.replace("；", "。")
                  }
              }
          
              // v0.3.5.3: ZipVoice 推理内存随参考音频长度急剧增长，且参考原文与音频不符时更严重。
              // 三星实测（v0.3.5.2 诊断报告）：参考 65.2 秒 + 原文 2 字 → 推理中被系统 SIGKILL。
              // 在调用原生推理前拦截，给出可操作的提示，而不是让进程被杀。
              // v0.3.5.4：按用户要求改为软上限。20 秒以内直接生成；20–60 秒提醒后由用户决定；超过 60 秒才拒绝。
              private val softReferenceSeconds = 20.0
              private val maxReferenceSeconds = 60.0
              private val minReferenceSeconds = 3.0

              private fun longReferenceWarning(seconds: Double): String =
                  "参考音频较长（${String.format(Locale.US, "%.1f", seconds)} 秒），可能导致内存不足而闪退，建议 8–20 秒。如仍要继续，可以点「继续生成」。"
              private val minReferenceUnitsPerSecond = 1.5

              private fun referenceTextUnits(text: String): Int {
                  val han = Regex("[\\u4e00-\\u9fff]").findAll(text).count()
                  val words = Regex("[A-Za-z]+").findAll(text).count()
                  return han + (words * 3 + 1) / 2
              }

              private fun referenceProblem(seconds: Double, referenceText: String): String? {
                  val units = referenceTextUnits(referenceText)
                  return when {
                      seconds > maxReferenceSeconds ->
                          "参考音频 ${String.format(Locale.US, "%.1f", seconds)} 秒，超过 ${maxReferenceSeconds.toInt()} 秒上限。请剪成 60 秒以内（建议 8–20 秒）的一段，并填写这一段的完整原文后重新导入。"
                      seconds < minReferenceSeconds ->
                          "参考音频只有 ${String.format(Locale.US, "%.1f", seconds)} 秒，太短。请使用 8–20 秒的参考音频。"
                      units < seconds * minReferenceUnitsPerSecond ->
                          "参考原文与音频不符：音频 ${String.format(Locale.US, "%.1f", seconds)} 秒，原文只有 $units 个字。请填写音频里完整说出的原文后重新导入。"
                      else -> null
                  }
              }

              private fun synthesizeOffline(raw: String, style: String, intensity: Int, preview: Boolean, voice: VoiceProfile) {
                  val localTts = tts ?: error("本地模型尚未加载完成")
                  val ref = readOwnWav(voiceFile(voice))
                  val refSeconds = ref.samples.size.toDouble() / ref.sampleRate.coerceAtLeast(1)
                  referenceProblem(refSeconds, voice.referenceText)?.let { error("音色「${voice.name}」无法使用：$it") }
                  val cfg = styleFor(style, intensity)
                  var source = if (preview) previewText(raw) else raw
                  source = transformText(source, style, intensity)
                  val chunks = splitText(source, if (preview) 120 else 300)
                  if (chunks.isEmpty()) error("没有可生成的文字")
          
                  val stamp = SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(Date())
                  val targetDir = if (preview) previewDir else worksDir
                  val tempFile = File(targetDir, ".part-$stamp-${System.nanoTime()}.wav")
                  val finalFile = if (preview) {
                      File(targetDir, "Preview-$stamp.wav")
                  } else {
                      File(targetDir, "VoiceForge-$stamp.wav")
                  }
          
                  try {
                      WavStreamWriter(tempFile, SAMPLE_RATE).use { writer ->
                          chunks.forEachIndexed { index, chunk ->
                              if (generationCancel.get() || shuttingDown) throw GenerationCancelledException()
                              js("window.onGenerationProgress&&window.onGenerationProgress(${index + 1},${chunks.size},${q("本地生成第 ${index + 1} 段")})")
                              val gc = GenerationConfig(
                                  silenceScale = cfg.silenceScale,
                                  speed = cfg.speed,
                                  sid = 0,
                                  referenceAudio = ref.samples,
                                  referenceSampleRate = ref.sampleRate,
                                  referenceText = voice.referenceText,
                                  numSteps = cfg.numSteps,
                                  extra = mapOf("min_char_in_sentence" to "2")
                              )
          
                              writeBreadcrumb(
                                  "原生推理开始（若停在这里，说明进程在推理中死亡）",
                                  "voice=${voice.name} refSeconds=${String.format(Locale.US, "%.1f", ref.samples.size.toFloat() / ref.sampleRate.coerceAtLeast(1))} " +
                                      "refSampleRate=${ref.sampleRate} refTextChars=${voice.referenceText.length} chunk=${index + 1}/${chunks.size} " +
                                      "chunkChars=${chunk.length} numSteps=${cfg.numSteps} speed=${cfg.speed} preview=$preview " +
                                      "threads=${Runtime.getRuntime().availableProcessors().coerceIn(2, 4)}"
                              )
                              localTts.generateWithConfigAndCallback(text = chunk, config = gc) { pcmChunk ->
                                  if (generationCancel.get() || shuttingDown) {
                                      0
                                  } else {
                                      writer.append(postProcess(pcmChunk, cfg.gain, cfg.tone))
                                      1
                                  }
                              }
          
                              if (generationCancel.get() || shuttingDown) throw GenerationCancelledException()
                              writer.appendSilence(cfg.chunkGapMs)
                          }
                      }
          
                      val info = inspectPcm16Wav(tempFile)
                      check(info.dataSize > 0L && info.sampleRate > 0) { "生成 WAV 无效" }
                      if (generationCancel.get() || shuttingDown) throw GenerationCancelledException()
          
                      if (finalFile.exists()) finalFile.delete()
                      if (!tempFile.renameTo(finalFile)) {
                          FileInputStream(tempFile).use { input ->
                              FileOutputStream(finalFile).use { output -> input.copyTo(output, 64 * 1024) }
                          }
                          tempFile.delete()
                      }
          
                      currentGenerated = finalFile
                      writeBreadcrumb("生成完成", "voice=${voice.name} chunks=${chunks.size} file=${finalFile.name}")
                      if (!preview) pruneOldWorks(50)
                      js("window.onGenerationComplete&&window.onGenerationComplete(${chunks.size},${q(style)})")
                      if (!preview) js("window.onHistoryChanged&&window.onHistoryChanged()")
                      playFile(finalFile)
                  } catch (t: Throwable) {
                      tempFile.delete()
                      if (t is GenerationCancelledException) {
                          finalFile.takeIf { it.name.startsWith("Preview-") && it.isFile }?.delete()
                      }
                      throw t
                  }
              }
          
              private fun pruneOldWorks(limit: Int) {
                  worksDir.listFiles()
                      ?.filter { it.isFile && it.extension.equals("wav", true) }
                      ?.sortedByDescending { it.lastModified() }
                      ?.drop(limit)
                      ?.forEach { it.delete() }
              }
          
              private fun postProcess(input: FloatArray, gain: Float, tone: Float): FloatArray {
                  val out = FloatArray(input.size)
                  var prev = 0f
                  for (i in input.indices) {
                      val x = input[i]
                      val shaped = if (tone >= 0f) {
                          // Small low-pass blend: warmer/rounder.
                          val y = x * (1f - tone.coerceIn(0f, 0.35f)) + prev * tone.coerceIn(0f, 0.35f)
                          prev = y
                          y
                      } else {
                          // Small high-frequency emphasis: sharper/more forward.
                          val a = (-tone).coerceIn(0f, 0.25f)
                          val y = x + a * (x - prev)
                          prev = x
                          y
                      }
                      out[i] = tanh((shaped * gain).toDouble()).toFloat().coerceIn(-0.99f, 0.99f)
                  }
                  return out
              }
          
              private fun voiceFile(v: VoiceProfile): File = File(voicesDir, v.fileName)


              private fun loadVoiceProfiles(): MutableList<VoiceProfile> {
