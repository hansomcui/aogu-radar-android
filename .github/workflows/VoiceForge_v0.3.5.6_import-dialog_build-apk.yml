name: Build VoiceForge v0.3.5.6 Import Dialog APK


on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/VoiceForge_v0.3.5.6_import-dialog_build-apk.yml"


permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/hansom/voiceforge app/src/main/assets app/src/main/res/values app/src/main/res/drawable app/src/main/res/xml app/libs
          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.name = "VoiceForgeOffline"
          include(":app")
          EOF_SETTINGS


          cat > build.gradle <<'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF_ROOT


          cat > gradle.properties <<'EOF_PROPS'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF_PROPS


          cat > app/build.gradle <<'EOF_APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          
          android {
              namespace 'com.hansom.voiceforge'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.hansom.voiceforge"
                  minSdk 29
                  targetSdk 34
                  versionCode 41
                  versionName "0.3.5.6"
                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }
          
              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          
              kotlinOptions {
                  jvmTarget = '17'
              }
          
              androidResources {
                  noCompress += ['onnx', 'txt', 'bin']
              }
          }
          
          dependencies {
              implementation files('libs/sherpa-onnx-1.13.8.aar')
              implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
          }
          EOF_APP


          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
          
              <application
                  android:allowBackup="false"
                  android:fullBackupContent="@xml/backup_rules"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST


          cat > app/src/main/java/com/hansom/voiceforge/MainActivity.kt <<'EOF_KT'
          package com.hansom.voiceforge
          
          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.database.Cursor
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import com.k2fsa.sherpa.onnx.GenerationConfig
          import com.k2fsa.sherpa.onnx.OfflineTts
          import com.k2fsa.sherpa.onnx.OfflineTtsConfig
          import com.k2fsa.sherpa.onnx.OfflineTtsModelConfig
          import com.k2fsa.sherpa.onnx.OfflineTtsZipVoiceModelConfig
          import com.tom_roush.pdfbox.android.PDFBoxResourceLoader
          import com.tom_roush.pdfbox.pdmodel.PDDocument
          import com.tom_roush.pdfbox.text.PDFTextStripper
          import org.json.JSONObject
          import org.json.JSONArray
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.InputStream
          import java.io.RandomAccessFile
          import java.nio.charset.StandardCharsets
          import java.util.Locale
          import java.util.Date
          import java.text.SimpleDateFormat
          import java.util.concurrent.Executors
          import java.util.concurrent.Future
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicInteger
          import java.util.zip.ZipInputStream
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.tanh
          import kotlin.math.log10
          import kotlin.math.sqrt
          
          class MainActivity : Activity() {
              companion object {
                  private const val REQ_MIC = 500
                  private const val REQ_DOC = 501
                  private const val REQ_SAVE_WAV = 502
                  private const val REQ_IMPORT_VOICE = 503
                  private const val SAMPLE_RATE = 24000
                  private const val MODEL_ASSET_DIR = "zipvoice"
                  private const val MODEL_VERSION = "zipvoice-int8-zh-en-v1"
                  private const val LEGACY_REF_FILE = "my_voice_reference.wav"
                  private const val PENDING_REF_FILE = "pending_voice_reference.wav"
          
                  // The user should read this exact sentence while recording.
                  private const val REFERENCE_TEXT =
                      "今天我用自己平时最自然的声音，读这一小段话。声音里有我的语气、节奏和呼吸，也有我平常说话时自然的停顿。以后无论读什么文字，都请保持是我的声音。"
              }
          
              private lateinit var webView: WebView
              private val executor = Executors.newSingleThreadExecutor()
              private val recording = AtomicBoolean(false)
              private val generationCancel = AtomicBoolean(false)
              private var recorder: AudioRecord? = null
              private var recordThread: Thread? = null
              @Volatile private var audioTrack: AudioTrack? = null
              private val playbackToken = AtomicInteger(0)
              @Volatile private var generationFuture: Future<*>? = null
              @Volatile private var shuttingDown = false
              private var tts: OfflineTts? = null
          
              @Volatile private var engineReady = false
              @Volatile private var engineState = "首次启动：正在准备本地模型"
              @Volatile private var currentGenerated: File? = null
              @Volatile private var generationInProgress = false
              @Volatile private var pendingSaveFile: File? = null
              @Volatile private var pendingSaveName: String? = null
              @Volatile private var pendingImportName: String? = null
              @Volatile private var pendingImportText: String? = null
          
              private data class VoiceProfile(val id: String, val name: String, val referenceText: String, val fileName: String)
              private val pendingReferenceFile: File by lazy { File(filesDir, PENDING_REF_FILE) }
              private val voicesDir: File by lazy { File(filesDir, "voices").apply { mkdirs() } }
              private val modelDir: File by lazy { File(filesDir, "models/zipvoice") }
              private val worksDir: File by lazy { File(filesDir, "works").apply { mkdirs() } }
              private val previewDir: File by lazy { File(cacheDir, "previews").apply { mkdirs() } }
              private val prefs by lazy { getSharedPreferences("voiceforge", MODE_PRIVATE) }
          
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  installJavaCrashRecorder()
                  window.statusBarColor = android.graphics.Color.rgb(11, 11, 12)
                  window.navigationBarColor = android.graphics.Color.rgb(11, 11, 12)
                  PDFBoxResourceLoader.init(applicationContext)
          
                  webView = WebView(this)
                  setContentView(webView)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mediaPlaybackRequiresUserGesture = false
                      defaultTextEncodingName = "utf-8"
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }
                  migrateLegacyVoiceIfNeeded()
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.addJavascriptInterface(Bridge(), "Android")
                  webView.loadUrl("file:///android_asset/index.html")
          
                  executor.execute { prepareEngine() }
                  webView.postDelayed({ runCatching { showLastExitReportIfAny() } }, 1500)
              }

              // ---- v0.3.5.2 diagnostics: record why the previous process died ----
              private val diagDir: File by lazy { File(filesDir, "diag").apply { mkdirs() } }
              private val breadcrumbFile: File by lazy { File(diagDir, "last_generation.txt") }
              private val javaCrashFile: File by lazy { File(diagDir, "last_java_crash.txt") }

              private fun installJavaCrashRecorder() {
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      runCatching {
                          val sw = java.io.StringWriter()
                          error.printStackTrace(java.io.PrintWriter(sw))
                          javaCrashFile.writeText("time=" + Date() + "\nthread=" + thread.name + "\n" + sw.toString().take(6000))
                      }
                      previous?.uncaughtException(thread, error)
                  }
              }

              private fun memorySnapshot(): String {
                  val am = getSystemService(ACTIVITY_SERVICE) as android.app.ActivityManager
                  val mi = android.app.ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  val nativeHeap = android.os.Debug.getNativeHeapAllocatedSize() / 1048576
                  return "deviceTotalMB=${mi.totalMem / 1048576} deviceAvailMB=${mi.availMem / 1048576} lowMemory=${mi.lowMemory} " +
                      "thresholdMB=${mi.threshold / 1048576} appMemoryClassMB=${am.memoryClass} largeMemoryClassMB=${am.largeMemoryClass} nativeHeapMB=$nativeHeap"
              }

              private fun writeBreadcrumb(stage: String, detail: String) {
                  runCatching {
                      breadcrumbFile.writeText(
                          "time=" + Date() + "\nstage=" + stage + "\n" + detail + "\nmemory: " + memorySnapshot() + "\n" +
                              "device=${android.os.Build.MANUFACTURER} ${android.os.Build.MODEL} android=${android.os.Build.VERSION.RELEASE} sdk=${android.os.Build.VERSION.SDK_INT}\n"
                      )
                  }
              }

              private fun exitReasonName(r: Int): String = when (r) {
                  1 -> "EXIT_SELF"; 2 -> "SIGNALED"; 3 -> "LOW_MEMORY(内存不足被系统杀死)"; 4 -> "CRASH(Java崩溃)"
                  5 -> "CRASH_NATIVE(原生层崩溃)"; 6 -> "ANR(无响应)"; 7 -> "INITIALIZATION_FAILURE"; 8 -> "PERMISSION_CHANGE"
                  9 -> "EXCESSIVE_RESOURCE_USAGE"; 10 -> "USER_REQUESTED"; 11 -> "USER_STOPPED"; 12 -> "DEPENDENCY_DIED"
                  13 -> "OTHER"; 14 -> "FREEZER"; 15 -> "PACKAGE_STATE_CHANGE"; 16 -> "PACKAGE_UPDATED"; else -> "UNKNOWN($r)"
              }

              private fun printableStrings(bytes: ByteArray, maxLines: Int): String {
                  val out = StringBuilder(); val cur = StringBuilder(); var lines = 0
                  for (b in bytes) {
                      val c = b.toInt() and 0xff
                      if (c in 32..126) cur.append(c.toChar()) else {
                          if (cur.length >= 6 && lines < maxLines) { out.append(cur).append('\n'); lines++ }
                          cur.setLength(0)
                      }
                  }
                  if (cur.length >= 6 && lines < maxLines) out.append(cur).append('\n')
                  return out.toString()
              }

              private fun showLastExitReportIfAny() {
                  val sb = StringBuilder()
                  var latestTs = 0L
                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      val am = getSystemService(ACTIVITY_SERVICE) as android.app.ActivityManager
                      val list = am.getHistoricalProcessExitReasons(packageName, 0, 3)
                      val lastShown = prefs.getLong("diag_last_shown_exit_ts", 0L)
                      val e = list.firstOrNull()
                      if (e != null && e.timestamp > lastShown && e.reason != 10 && e.reason != 11 && e.reason != 16 && e.reason != 1) {
                          latestTs = e.timestamp
                          sb.append("【上次退出原因】").append(exitReasonName(e.reason)).append('\n')
                          sb.append("time=").append(Date(e.timestamp)).append(" status=").append(e.status)
                              .append(" importance=").append(e.importance).append('\n')
                          sb.append("pssMB=").append(e.pss / 1024).append(" rssMB=").append(e.rss / 1024).append('\n')
                          sb.append("description=").append(e.description ?: "").append('\n')
                          runCatching {
                              e.traceInputStream?.use { s ->
                                  val bytes = s.readBytes()
                                  sb.append("\n【崩溃记录摘要】(").append(bytes.size).append(" bytes)\n")
                                  sb.append(printableStrings(bytes, 60).take(5000))
                              }
                          }
                      }
                  } else {
                      sb.append("【提示】Android 版本低于 11，系统不提供退出原因。\n")
                  }
                  if (javaCrashFile.isFile) { sb.append("\n【Java 崩溃】\n").append(javaCrashFile.readText().take(4000)).append('\n') }
                  if (sb.isEmpty()) return
                  if (breadcrumbFile.isFile) sb.append("\n【崩溃前最后一次生成】\n").append(breadcrumbFile.readText().take(2000))
                  val report = "声魄 VoiceForge 诊断报告 v0.3.5.6\n" + sb.toString()
                  runCatching { File(diagDir, "last_report.txt").writeText(report) }
                  val tv = android.widget.TextView(this).apply {
                      text = report; setTextIsSelectable(true); textSize = 12f; setPadding(32, 24, 32, 24)
                  }
                  val scroll = android.widget.ScrollView(this).apply { addView(tv) }
                  android.app.AlertDialog.Builder(this)
                      .setTitle("检测到上次异常退出")
                      .setView(scroll)
                      .setPositiveButton("复制报告") { _, _ ->
                          val cm = getSystemService(CLIPBOARD_SERVICE) as android.content.ClipboardManager
                          cm.setPrimaryClip(android.content.ClipData.newPlainText("VoiceForge诊断", report))
                          toast("诊断报告已复制，可以直接粘贴发送")
                      }
                      .setNegativeButton("关闭", null)
                      .show()
                  if (latestTs > 0) prefs.edit().putLong("diag_last_shown_exit_ts", latestTs).apply()
                  javaCrashFile.delete()
              }
          
              inner class Bridge {
                  @JavascriptInterface
                  fun getState(): String {
                      val o = JSONObject()
                      o.put("engineReady", engineReady)
                      o.put("engineState", engineState)
                      val active = activeVoiceProfile()
                      val activeFile = active?.let { voiceFile(it) }
                      o.put("hasReference", active != null && activeFile?.isFile == true && activeFile.length() > 1000)
                      o.put("referenceRecorded", pendingReferenceFile.isFile && pendingReferenceFile.length() > 1000)
                      o.put("referenceConfirmed", active != null)
                      o.put("referenceText", REFERENCE_TEXT)
                      o.put("referenceBytes", if (activeFile?.isFile == true) activeFile.length() else 0)
                      o.put("activeVoiceId", active?.id ?: "")
                      o.put("activeVoiceName", active?.name ?: "")
                      val voices = JSONArray()
                      loadVoiceProfiles().forEach { v ->
                          val f = voiceFile(v)
                          voices.put(JSONObject().apply {
                              put("id", v.id); put("name", v.name); put("referenceText", v.referenceText)
                              put("bytes", if (f.isFile) f.length() else 0); put("active", v.id == active?.id)
                          })
                      }
                      o.put("voiceProfiles", voices)
                      o.put("hasGenerated", currentGenerated?.isFile == true)
                      o.put("generationInProgress", generationInProgress)
                      return o.toString()
                  }
          
                  @JavascriptInterface
                  fun startReferenceRecording() {
                      runOnUiThread {
                          if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), REQ_MIC)
                          } else {
                              startRecorder()
                          }
                      }
                  }
          
                  @JavascriptInterface
                  fun stopReferenceRecording() {
                      stopRecorder()
                  }
          
                  @JavascriptInterface
                  fun playReference() {
                      runOnUiThread {
                          val f = if (pendingReferenceFile.isFile) pendingReferenceFile else activeVoiceProfile()?.let { voiceFile(it) }
                          if (f?.isFile != true) toast("还没有参考声音") else playFile(f)
                      }
                  }
          
                  @JavascriptInterface
                  fun deleteReference() {
                      stopRecorder()
                      if (pendingReferenceFile.exists()) pendingReferenceFile.delete()
                      js("window.onReferenceDeleted&&window.onReferenceDeleted()")
                  }
          
                  @JavascriptInterface
                  fun saveRecordedVoice(name: String?) {
                      val n = name?.trim().orEmpty().ifBlank { "我的声音" }.take(40)
                      if (!pendingReferenceFile.isFile || pendingReferenceFile.length() <= 1000L) { toast("请先完成参考录音"); return }
                      val profiles = loadVoiceProfiles()
                      val existing = profiles.firstOrNull { it.name == n }
                      val id = existing?.id ?: "voice-" + System.currentTimeMillis()
                      val fileName = existing?.fileName ?: "$id.wav"
                      val dest = File(voicesDir, fileName)
                      pendingReferenceFile.copyTo(dest, overwrite = true)
                      pendingReferenceFile.delete()
                      val v = VoiceProfile(id, n, REFERENCE_TEXT, fileName)
                      if (existing == null) profiles.add(v) else profiles[profiles.indexOf(existing)] = v
                      saveVoiceProfiles(profiles)
                      prefs.edit().putString("active_voice_id", id).apply()
                      js("window.onVoiceLibraryChanged&&window.onVoiceLibraryChanged()")
                  }
          
                  @JavascriptInterface
                  fun importVoice(name: String?, referenceText: String?) {
                      val n = name?.trim().orEmpty().take(40)
                      val t = referenceText?.trim().orEmpty()
                      if (n.isBlank() || t.isBlank()) { toast("音色名称和参考原文都不能为空"); return }
                      pendingImportName = n; pendingImportText = t
                      runOnUiThread {
                          val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE); type = "*/*"
                          }
                          startActivityForResult(i, REQ_IMPORT_VOICE)
                      }
                  }
          
                  @JavascriptInterface fun selectVoice(id: String?) {
                      val v = loadVoiceProfiles().firstOrNull { it.id == id } ?: return
                      prefs.edit().putString("active_voice_id", v.id).apply()
                      js("window.onVoiceLibraryChanged&&window.onVoiceLibraryChanged()")
                  }
          
                  @JavascriptInterface fun playVoice(id: String?) {
                      val v = loadVoiceProfiles().firstOrNull { it.id == id } ?: return
                      val f = voiceFile(v); if (f.isFile) playFile(f) else toast("音色文件不存在")
                  }
          
                  @JavascriptInterface fun deleteVoice(id: String?) {
                      val profiles = loadVoiceProfiles(); val v = profiles.firstOrNull { it.id == id } ?: return
                      voiceFile(v).delete(); profiles.remove(v); saveVoiceProfiles(profiles)
                      if (prefs.getString("active_voice_id", "") == v.id) prefs.edit().putString("active_voice_id", profiles.firstOrNull()?.id ?: "").apply()
                      js("window.onVoiceLibraryChanged&&window.onVoiceLibraryChanged()")
                  }
          
                  @JavascriptInterface
                  fun pickDocument() {
                      runOnUiThread {
                          val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                              putExtra(
                                  Intent.EXTRA_MIME_TYPES,
                                  arrayOf(
                                      "text/plain",
                                      "text/markdown",
                                      "application/pdf",
                                      "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                                  )
                              )
                          }
                          startActivityForResult(i, REQ_DOC)
                      }
                  }
          
                  @JavascriptInterface
                  fun synthesize(text: String?, style: String?, intensity: Int, preview: Boolean) {
                      val clean = text?.trim().orEmpty()
                      if (clean.isEmpty()) {
                          js("window.onGenerationError&&window.onGenerationError('请先导入或粘贴文字')")
                          return
                      }
                      if (!engineReady || shuttingDown) {
                          js("window.onGenerationError&&window.onGenerationError(${q(engineState)})")
                          return
                      }
                      val voice = activeVoiceProfile()
                      val voiceRef = voice?.let { voiceFile(it) }
                      if (voice == null || voiceRef?.isFile != true) {
                          js("window.onGenerationError&&window.onGenerationError('请先在音色库选择一个可用音色')")
                          return
                      }
                      if (generationInProgress) {
                          js("window.onGenerationError&&window.onGenerationError('已有生成任务正在运行')")
                          return
                      }
          
                      val start = {
                          generationCancel.set(false)
                          generationInProgress = true
                          generationFuture = executor.submit {
                              try {
                                  synthesizeOffline(clean, style ?: "深沉克制", intensity.coerceIn(0, 100), preview, voice)
                              } catch (_: GenerationCancelledException) {
                                  js("window.onGenerationCancelled&&window.onGenerationCancelled()")
                              } catch (t: Throwable) {
                                  if (!shuttingDown) js("window.onGenerationError&&window.onGenerationError(${q(friendly(t))})")
                              } finally {
                                  generationInProgress = false
                                  generationFuture = null
                                  generationCancel.set(false)
                              }
                          }
                      }

                      // v0.3.5.4 软上限：参考音频 20–60 秒时先提醒，由用户决定是否继续。
                      val refSeconds = runCatching {
                          val info = inspectPcm16Wav(voiceRef)
                          info.dataSize.toDouble() / 2.0 / info.sampleRate.coerceAtLeast(1)
                      }.getOrDefault(0.0)
                      if (refSeconds > softReferenceSeconds && refSeconds <= maxReferenceSeconds) {
                          runOnUiThread {
                              android.app.AlertDialog.Builder(this@MainActivity)
                                  .setTitle("参考音频较长")
                                  .setMessage(longReferenceWarning(refSeconds))
                                  .setPositiveButton("继续生成") { _, _ -> start() }
                                  .setNegativeButton("取消") { _, _ ->
                                      js("window.onGenerationCancelled&&window.onGenerationCancelled()")
                                  }
                                  .setOnCancelListener {
                                      js("window.onGenerationCancelled&&window.onGenerationCancelled()")
                                  }
                                  .show()
                          }
                          return
                      }
                      start()
                  }
          
                  @JavascriptInterface
                  fun cancelGeneration() {
                      if (!generationInProgress) {
                          toast("当前没有正在生成的任务")
                          return
                      }
                      generationCancel.set(true)
                      js("window.onGenerationCancelling&&window.onGenerationCancelling()")
                  }
          
                  @JavascriptInterface
                  fun confirmReferenceComplete() { saveRecordedVoice("我的声音") }
          
                  @JavascriptInterface
                  fun listWorks(): String {
                      val arr = JSONArray()
                      worksDir.listFiles()
                          ?.filter { it.isFile && it.extension.equals("wav", true) && !it.name.startsWith(".") }
                          ?.sortedByDescending { it.lastModified() }
                          ?.take(50)
                          ?.forEach { f ->
                              arr.put(JSONObject().apply {
                                  put("name", f.name)
                                  put("bytes", f.length())
                                  put("modified", f.lastModified())
                              })
                          }
                      return arr.toString()
                  }
          
                  @JavascriptInterface
                  fun playWork(name: String?) {
                      safeWorkFile(name)?.let { playFile(it) } ?: toast("作品不存在")
                  }
          
                  @JavascriptInterface
                  fun saveWork(name: String?) {
                      val f = safeWorkFile(name)
                      if (f == null) toast("作品不存在") else openSaveDialog(f)
                  }
          
                  @JavascriptInterface
                  fun deleteWork(name: String?) {
                      val f = safeWorkFile(name) ?: return
                      if (currentGenerated?.absolutePath == f.absolutePath) currentGenerated = null
                      if (f.delete()) js("window.onHistoryChanged&&window.onHistoryChanged()")
                  }
          
                  @JavascriptInterface
                  fun replayGenerated() {
                      runOnUiThread {
                          val f = currentGenerated
                          if (f == null || !f.isFile) toast("还没有生成音频") else playFile(f)
                      }
                  }
          
                  @JavascriptInterface
                  fun stopAudio() {
                      stopPlayback()
                  }
          
                  @JavascriptInterface
                  fun saveGenerated() {
                      if (generationInProgress) {
                          toast("正在生成，请先等待完成或取消生成")
                          return
                      }
                      val f = currentGenerated
                      if (f == null || !f.isFile || f.length() <= 44L) {
                          toast("还没有可保存的完整 WAV")
                          return
                      }
                      openSaveDialog(f)
