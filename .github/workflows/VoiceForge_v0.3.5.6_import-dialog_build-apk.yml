                          val pickedName = runCatching { getFileName(uri) }.getOrDefault("所选文件")
                          try {
                              val input = try {
                                  contentResolver.openInputStream(uri)
                              } catch (e: SecurityException) {
                                  throw IllegalStateException("没有读取该文件的权限")
                              } catch (e: java.io.FileNotFoundException) {
                                  throw IllegalStateException("找不到该文件")
                              }
                              val raw = File(cacheDir, "import-$id.raw")
                              try {
                                  requireNotNull(input) { "系统无法打开该文件" }.use { inp ->
                                      FileOutputStream(raw).use { output -> inp.copyTo(output, 1024 * 1024) }
                                  }
                                  val alreadyPcm16Mono = runCatching { inspectPcm16Wav(raw) }.isSuccess
                                  if (alreadyPcm16Mono) {
                                      if (!raw.renameTo(dest)) { raw.copyTo(dest, overwrite = true) }
                                  } else {
                                      try {
                                          decodeAudioToWav(raw, dest)
                                      } catch (e: IllegalArgumentException) {
                                          throw e
                                      } catch (e: Throwable) {
                                          throw IllegalArgumentException("无法读取这个音频（支持 WAV、MP3、M4A、MP4 等）：" + (e.message ?: e.javaClass.simpleName))
                                      }
                                  }
                              } finally {
                                  runCatching { raw.delete() }
                              }
                              val info = try {
                                  inspectPcm16Wav(dest)
                              } catch (e: Throwable) {
                                  throw IllegalArgumentException("音频转换后校验失败：" + (e.message ?: e.javaClass.simpleName))
                              }
                              val importSeconds = info.dataSize.toDouble() / 2.0 / info.sampleRate.coerceAtLeast(1)
                              referenceProblem(importSeconds, rt)?.let { throw IllegalArgumentException(it) }
