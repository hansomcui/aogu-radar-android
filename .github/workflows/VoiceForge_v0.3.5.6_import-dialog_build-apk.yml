              private fun copyAssetTree(assetPath: String, dest: File) {
                  val list = assets.list(assetPath) ?: emptyArray()
                  if (list.isEmpty()) {
                      dest.parentFile?.mkdirs()
                      assets.open(assetPath).use { input ->
                          FileOutputStream(dest).use { output -> input.copyTo(output, 1024 * 1024) }
                      }
                      return
                  }
                  dest.mkdirs()
                  list.forEach { child ->
                      copyAssetTree("$assetPath/$child", File(dest, child))
                  }
              }
          
              private fun startRecorder() {
                  if (recording.get()) return
                  runCatching { pendingReferenceFile.delete() }
                  val minBuffer = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )
                  if (minBuffer <= 0) {
                      toast("当前设备无法建立 24kHz 录音")
                      return
                  }
                  val ar = AudioRecord(
                      MediaRecorder.AudioSource.VOICE_RECOGNITION,
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                      max(minBuffer, 8192)
                  )
                  if (ar.state != AudioRecord.STATE_INITIALIZED) {
                      ar.release()
                      toast("麦克风初始化失败")
                      return
                  }
                  recorder = ar
                  recording.set(true)
                  ar.startRecording()
                  js("window.onRecordingStarted&&window.onRecordingStarted()")
          
                  recordThread = Thread {
                      val raw = ByteArrayOutputStream()
                      val buf = ShortArray(4096)
                      var totalSamples = 0L
                      try {
                          while (recording.get()) {
                              val n = ar.read(buf, 0, buf.size)
                              if (n > 0) {
                                  for (i in 0 until n) {
                                      val v = buf[i].toInt()
                                      raw.write(v and 0xff)
                                      raw.write((v shr 8) and 0xff)
                                  }
                                  totalSamples += n
                                  if (totalSamples >= SAMPLE_RATE * 60L) {
                                      recording.set(false)
                                      runOnUiThread { runCatching { ar.stop() } }
                                  }
                              }
                          }
                      } finally {
                          runCatching { ar.stop() }
                          runCatching { ar.release() }
                          recorder = null
                          val pcm = raw.toByteArray()
                          val q = analyzeRecordingQuality(pcm, SAMPLE_RATE)
                          if (q.ok) {
                              writePcm16Wav(pendingReferenceFile, pcm, SAMPLE_RATE)
                              js("window.onRecordingQuality&&window.onRecordingQuality(${String.format(Locale.US, "%.1f", q.seconds)},${String.format(Locale.US, "%.1f", q.rmsDb)},${String.format(Locale.US, "%.2f", q.clipPct)},${String.format(Locale.US, "%.1f", q.silencePct)},${String.format(Locale.US, "%.1f", q.dynamicDb)})")
                          } else {
                              pendingReferenceFile.delete()
                              js("window.onRecordingError&&window.onRecordingError(${q(q.message)})")
                          }
                      }
                  }.also {
                      it.name = "VoiceForgeRecorder"
                      it.start()
                  }
              }
          
              private data class RecordingQuality(
                  val ok: Boolean,
                  val message: String,
                  val seconds: Double,
                  val rmsDb: Double,
                  val clipPct: Double,
                  val silencePct: Double,
                  val dynamicDb: Double
              )
          
              private fun analyzeRecordingQuality(pcm: ByteArray, sampleRate: Int): RecordingQuality {
                  val sampleCount = pcm.size / 2
                  val seconds = sampleCount.toDouble() / sampleRate
                  if (seconds < 7.0) return RecordingQuality(false, "录音太短。请完整读完参考句，建议 8–20 秒。", seconds, -99.0, 0.0, 100.0, 0.0)
                  if (seconds > 60.5) return RecordingQuality(false, "录音太长，请控制在 60 秒以内。", seconds, -99.0, 0.0, 100.0, 0.0)
          
                  var sumSq = 0.0
                  var peak = 0
                  var clipped = 0
                  val frameSamples = max(1, sampleRate / 50) // 20 ms
                  val frameDb = ArrayList<Double>()
                  var frameSq = 0.0
                  var frameN = 0
                  var i = 0
                  while (i + 1 < pcm.size) {
                      val lo = pcm[i].toInt() and 0xff
                      val hi = pcm[i + 1].toInt()
                      val s = ((hi shl 8) or lo).toShort().toInt()
                      val a = kotlin.math.abs(s)
                      if (a > peak) peak = a
                      if (a >= 32600) clipped++
                      val d = s.toDouble()
                      sumSq += d * d
                      frameSq += d * d
                      frameN++
                      if (frameN >= frameSamples) {
                          val rms = sqrt(frameSq / frameN) / 32768.0
                          frameDb.add(20.0 * log10(rms.coerceAtLeast(1e-9)))
                          frameSq = 0.0
                          frameN = 0
                      }
                      i += 2
                  }
          
                  val rms = sqrt(sumSq / sampleCount.coerceAtLeast(1)) / 32768.0
                  val rmsDb = 20.0 * log10(rms.coerceAtLeast(1e-9))
                  val clipPct = clipped * 100.0 / sampleCount.coerceAtLeast(1)
                  val silencePct = if (frameDb.isEmpty()) 100.0 else frameDb.count { it < -45.0 } * 100.0 / frameDb.size
                  val sorted = frameDb.sorted()
                  fun percentile(p: Double): Double {
                      if (sorted.isEmpty()) return -99.0
                      val idx = ((sorted.size - 1) * p).toInt().coerceIn(0, sorted.lastIndex)
                      return sorted[idx]
                  }
                  val dynamicDb = percentile(0.90) - percentile(0.10)
          
                  val message = when {
                      rmsDb < -35.0 -> "声音太小或环境太远，请靠近手机重新录制。"
                      rmsDb > -5.0 -> "声音过大，请离麦克风稍远一些重新录制。"
                      clipPct > 0.50 -> "录音存在明显爆音/削波，请降低音量重新录制。"
                      silencePct > 55.0 -> "录音中静音过多，请连续、完整读完参考句。"
                      dynamicDb < 7.0 -> "有效语音与背景噪声区分不足，请换更安静的环境重新录制。"
                      else -> ""
                  }
                  return RecordingQuality(message.isEmpty(), message, seconds, rmsDb, clipPct, silencePct, dynamicDb)
              }
          
              private fun stopRecorder() {
                  recording.set(false)
                  runCatching { recorder?.stop() }
              }
          
              private data class WavData(val sampleRate: Int, val samples: FloatArray)
          
              private fun readOwnWav(file: File): WavData {
                  val data = file.readBytes()
                  require(data.size >= 44) { "参考音频损坏" }
                  require(String(data, 0, 4, Charsets.US_ASCII) == "RIFF") { "参考音频不是 WAV" }
                  val sr = littleInt(data, 24)
                  val bits = littleShort(data, 34)
                  require(bits == 16) { "参考音频必须是 PCM16" }
                  var pos = 12
                  var dataOffset = -1
                  var dataSize = 0
                  while (pos + 8 <= data.size) {
                      val id = String(data, pos, 4, Charsets.US_ASCII)
                      val size = littleInt(data, pos + 4)
                      if (id == "data") {
                          dataOffset = pos + 8
                          dataSize = min(size, data.size - dataOffset)
                          break
                      }
                      pos += 8 + size + (size and 1)
                  }
                  require(dataOffset >= 0) { "参考 WAV 缺少 data 区" }
                  val count = dataSize / 2
                  val samples = FloatArray(count)
                  var p = dataOffset
                  for (i in 0 until count) {
                      val lo = data[p].toInt() and 0xff
                      val hi = data[p + 1].toInt()
                      val s = ((hi shl 8) or lo).toShort()
                      samples[i] = s / 32768f
                      p += 2
                  }
                  return WavData(sr, samples)
              }
          
              // v0.3.5.5：用安卓系统自带解码器把 MP3 / M4A / MP4 等转成 24kHz 单声道 PCM16 WAV。
              // 超过 maxDecodeSeconds 立即停止并报错，避免把很长的视频整段读进内存。
              private val maxDecodeSeconds = 60.5

              private fun decodeAudioToWav(src: File, dest: File) {
                  val extractor = android.media.MediaExtractor()
                  var codec: android.media.MediaCodec? = null
                  try {
                      extractor.setDataSource(src.absolutePath)
                      val track = (0 until extractor.trackCount).firstOrNull {
                          extractor.getTrackFormat(it).getString(android.media.MediaFormat.KEY_MIME)?.startsWith("audio/") == true
                      } ?: throw IllegalArgumentException("文件里没有找到音频")
                      extractor.selectTrack(track)
                      val inFormat = extractor.getTrackFormat(track)
                      val mime = inFormat.getString(android.media.MediaFormat.KEY_MIME)!!
                      val dec = android.media.MediaCodec.createDecoderByType(mime)
                      codec = dec
                      dec.configure(inFormat, null, null, 0)
                      dec.start()

                      var srcRate = if (inFormat.containsKey(android.media.MediaFormat.KEY_SAMPLE_RATE)) inFormat.getInteger(android.media.MediaFormat.KEY_SAMPLE_RATE) else 44100
                      var channels = if (inFormat.containsKey(android.media.MediaFormat.KEY_CHANNEL_COUNT)) inFormat.getInteger(android.media.MediaFormat.KEY_CHANNEL_COUNT) else 1
                      var isFloat = false
                      var mono = FloatArray(1 shl 16)
                      var monoLen = 0
                      val bufInfo = android.media.MediaCodec.BufferInfo()
                      var inputDone = false
                      var outputDone = false
                      while (!outputDone) {
                          if (!inputDone) {
                              val inIndex = dec.dequeueInputBuffer(10_000)
                              if (inIndex >= 0) {
                                  val buf = dec.getInputBuffer(inIndex)!!
                                  val size = extractor.readSampleData(buf, 0)
                                  if (size < 0) {
                                      dec.queueInputBuffer(inIndex, 0, 0, 0, android.media.MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                      inputDone = true
                                  } else {
                                      dec.queueInputBuffer(inIndex, 0, size, extractor.sampleTime, 0)
                                      extractor.advance()
                                  }
                              }
                          }
                          val outIndex = dec.dequeueOutputBuffer(bufInfo, 10_000)
                          if (outIndex == android.media.MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              val f = dec.outputFormat
                              if (f.containsKey(android.media.MediaFormat.KEY_SAMPLE_RATE)) srcRate = f.getInteger(android.media.MediaFormat.KEY_SAMPLE_RATE)
                              if (f.containsKey(android.media.MediaFormat.KEY_CHANNEL_COUNT)) channels = f.getInteger(android.media.MediaFormat.KEY_CHANNEL_COUNT)
                              isFloat = f.containsKey(android.media.MediaFormat.KEY_PCM_ENCODING) &&
                                  f.getInteger(android.media.MediaFormat.KEY_PCM_ENCODING) == AudioFormat.ENCODING_PCM_FLOAT
                          } else if (outIndex >= 0) {
                              val out = dec.getOutputBuffer(outIndex)!!
                              out.position(bufInfo.offset); out.limit(bufInfo.offset + bufInfo.size)
                              val ch = channels.coerceAtLeast(1)
                              val frames = if (isFloat) bufInfo.size / 4 / ch else bufInfo.size / 2 / ch
                              if (monoLen + frames > mono.size) mono = mono.copyOf(max(mono.size * 2, monoLen + frames))
                              val bb = out.order(java.nio.ByteOrder.LITTLE_ENDIAN)
                              for (i in 0 until frames) {
                                  var sum = 0f
                                  for (c in 0 until ch) sum += if (isFloat) bb.float else bb.short / 32768f
                                  mono[monoLen++] = sum / ch
                              }
                              dec.releaseOutputBuffer(outIndex, false)
                              if (monoLen.toDouble() / srcRate.coerceAtLeast(1) > maxDecodeSeconds) {
                                  throw IllegalArgumentException("音频超过 ${maxReferenceSeconds.toInt()} 秒上限。请剪成 60 秒以内（建议 8–20 秒）的一段后再导入。")
                              }
                              if (bufInfo.flags and android.media.MediaCodec.BUFFER_FLAG_END_OF_STREAM != 0) outputDone = true
                          }
                      }
                      require(monoLen > 0) { "没有解码出声音" }

                      // 线性插值重采样到 24kHz
                      val outLen = (monoLen.toLong() * SAMPLE_RATE / srcRate.coerceAtLeast(1)).toInt()
                      val pcm = ByteArray(outLen * 2)
                      val step = srcRate.toDouble() / SAMPLE_RATE
                      for (i in 0 until outLen) {
                          val pos = i * step
                          val i0 = pos.toInt().coerceAtMost(monoLen - 1)
                          val i1 = (i0 + 1).coerceAtMost(monoLen - 1)
                          val frac = (pos - i0).toFloat()
                          val v = (mono[i0] * (1 - frac) + mono[i1] * frac).coerceIn(-1f, 1f)
                          val s = (v * 32767f).toInt()
                          pcm[i * 2] = (s and 0xff).toByte()
                          pcm[i * 2 + 1] = ((s shr 8) and 0xff).toByte()
                      }
                      writePcm16Wav(dest, pcm, SAMPLE_RATE)
                  } finally {
                      runCatching { codec?.stop() }
                      runCatching { codec?.release() }
                      runCatching { extractor.release() }
                  }
              }

              private fun writePcm16Wav(file: File, pcm: ByteArray, sampleRate: Int) {
                  FileOutputStream(file).use { out ->
                      val dataSize = pcm.size
                      out.write("RIFF".toByteArray(Charsets.US_ASCII))
                      writeLE32(out, 36 + dataSize)
                      out.write("WAVEfmt ".toByteArray(Charsets.US_ASCII))
                      writeLE32(out, 16)
                      writeLE16(out, 1)
                      writeLE16(out, 1)
                      writeLE32(out, sampleRate)
                      writeLE32(out, sampleRate * 2)
                      writeLE16(out, 2)
                      writeLE16(out, 16)
                      out.write("data".toByteArray(Charsets.US_ASCII))
                      writeLE32(out, dataSize)
                      out.write(pcm)
                  }
              }
          
              private class WavStreamWriter(private val file: File, private val sampleRate: Int) : AutoCloseable {
                  private val raf = RandomAccessFile(file, "rw")
                  private var sampleCount = 0L
                  init {
                      raf.setLength(0)
                      repeat(44) { raf.write(0) }
                  }
                  fun append(samples: FloatArray) {
                      samples.forEach { f ->
                          val s = (f.coerceIn(-1f, 1f) * 32767f).toInt().toShort().toInt()
                          raf.write(s and 0xff)
                          raf.write((s shr 8) and 0xff)
                          sampleCount++
                      }
                  }
                  fun appendSilence(ms: Int) {
                      val n = (sampleRate * ms / 1000.0).toInt()
                      repeat(n) {
                          raf.write(0)
                          raf.write(0)
                          sampleCount++
                      }
                  }
                  override fun close() {
                      val dataSize = (sampleCount * 2L).toInt()
                      raf.seek(0)
                      raf.writeBytes("RIFF")
                      writeLE32(raf, 36 + dataSize)
                      raf.writeBytes("WAVEfmt ")
                      writeLE32(raf, 16)
                      writeLE16(raf, 1)
                      writeLE16(raf, 1)
                      writeLE32(raf, sampleRate)
                      writeLE32(raf, sampleRate * 2)
                      writeLE16(raf, 2)
                      writeLE16(raf, 16)
                      raf.writeBytes("data")
                      writeLE32(raf, dataSize)
                      raf.close()
                  }
                  companion object {
                      private fun writeLE16(r: RandomAccessFile, v: Int) {
                          r.write(v and 0xff); r.write((v shr 8) and 0xff)
                      }
                      private fun writeLE32(r: RandomAccessFile, v: Int) {
                          r.write(v and 0xff); r.write((v shr 8) and 0xff)
                          r.write((v shr 16) and 0xff); r.write((v shr 24) and 0xff)
                      }
                  }
              }
          
              private fun splitText(text: String, maxChars: Int): List<String> {
                  val normalized = text.replace("\r\n", "\n").replace('\r', '\n').replace(Regex("[ \t]+"), " ").trim()
                  if (normalized.isEmpty()) return emptyList()
                  val targetMin = 180
                  val targetMax = max(240, maxChars).coerceAtMost(340)
                  val paragraphs = normalized.split(Regex("\n\\s*\n+")).map { it.trim() }.filter { it.isNotEmpty() }
                  val output = mutableListOf<String>()
                  val pack = StringBuilder()
          
                  fun flushPack() {
                      val s = pack.toString().trim()
                      if (s.isNotEmpty()) output += s
                      pack.clear()
                  }
          
                  fun appendSentence(sentence: String) {
                      val s = sentence.trim()
                      if (s.isEmpty()) return
                      if (s.length > targetMax) {
                          if (pack.isNotEmpty()) flushPack()
                          splitLongSentence(s, targetMin, targetMax).forEach { if (it.isNotBlank()) output += it.trim() }
                          return
                      }
                      if (pack.isEmpty()) pack.append(s)
                      else if (pack.length + s.length <= targetMax) pack.append(s)
                      else { flushPack(); pack.append(s) }
                  }
          
                  paragraphs.forEachIndexed { pIndex, paragraph ->
                      splitIntoLogicalSentences(paragraph).forEach { appendSentence(it) }
                      if (pack.length >= targetMin || pIndex == paragraphs.lastIndex) flushPack()
                      else if (pack.isNotEmpty()) pack.append('\n')
                  }
                  flushPack()
                  return output
              }
          
              private fun splitIntoLogicalSentences(paragraph: String): List<String> {
                  val output = mutableListOf<String>()
                  val buf = StringBuilder()
                  var i = 0
                  while (i < paragraph.length) {
                      val c = paragraph[i]
                      buf.append(c)
                      if (c in charArrayOf('。', '！', '？', '!', '?', '；', ';')) {
                          var j = i + 1
                          while (j < paragraph.length && paragraph[j] in charArrayOf('”', '’', '"', '\'', '》', '）', ')', '】', ']')) {
                              buf.append(paragraph[j]); j++
                          }
                          val s = buf.toString().trim()
                          if (s.isNotEmpty()) output += s
                          buf.clear(); i = j; continue
                      }
                      i++
                  }
                  val tail = buf.toString().trim()
                  if (tail.isNotEmpty()) output += tail
                  return output
              }
          
              private fun splitLongSentence(sentence: String, targetMin: Int, targetMax: Int): List<String> {
                  val output = mutableListOf<String>()
                  var remaining = sentence.trim()
                  while (remaining.length > targetMax) {
                      val begin = targetMin.coerceAtMost(remaining.length - 1)
                      val end = targetMax.coerceAtMost(remaining.length - 1)
                      var cut = -1
                      for (i in end downTo begin) if (remaining[i] in charArrayOf('：', ':', '—')) { cut = i + 1; break }
                      if (cut <= 0) for (i in end downTo begin) if (remaining[i] in charArrayOf('，', ',', '、')) { cut = i + 1; break }
                      if (cut <= 0) cut = targetMax
                      output += remaining.substring(0, cut).trim()
                      remaining = remaining.substring(cut).trim()
                  }
                  if (remaining.isNotEmpty()) output += remaining
                  return output
              }
          
              private fun previewText(text: String): String {
                  val t = text.trim()
                  if (t.length <= 100) return t
                  var end = min(120, t.length)
                  for (i in min(120, t.length - 1) downTo 55) {
                      if (t[i] in charArrayOf('。', '！', '？', '!', '?', '；', ';')) {
                          end = i + 1
                          break
                      }
                  }
                  return t.substring(0, end)
              }
          
