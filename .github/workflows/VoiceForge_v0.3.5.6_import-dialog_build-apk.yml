                  return runCatching {
                      val arr = JSONArray(raw); val out = mutableListOf<VoiceProfile>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out += VoiceProfile(o.getString("id"), o.getString("name"), o.getString("referenceText"), o.getString("fileName"))
                      }; out
                  }.getOrDefault(mutableListOf())
