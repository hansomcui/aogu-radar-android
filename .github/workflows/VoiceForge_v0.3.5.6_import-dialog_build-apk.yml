          <script>
          const presets=[
          ["深沉克制","低沉、慢一些、长停顿、句尾收住。"],
          ["机智勇敢","明快、果断、节奏紧、锋利一点。"],
          ["深情慈悲","温暖、从容、停顿柔和、不煽情。"],
          ["嚣张跋扈","强势、前冲、短停顿、力度更大。"],
          ["风流倜傥","松弛、利落、略快、带一点轻盈。"],
          ["雄浑壮烈","厚重、慢、段落推进明显、能量更强。"]
          ];
          let selected="深沉克制", recording=false;
          
          function go(id){
           document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));
           document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===id));
           scrollTo(0,0); refresh();
          }
          function renderStyles(){
           styles.innerHTML=presets.map(([n,d])=>`<div class="style ${selected===n?'active':''}" onclick="selected='${n}';renderStyles()"><b>${n}</b><p>${d}</p></div>`).join('');
          }
          renderStyles();
          
          const script=document.getElementById('script');
          script.addEventListener('input',()=>{
           const n=script.value.replace(/\s/g,'').length;
           chars.textContent=n+' 字';
           eta.textContent='预计 '+(n?Math.max(1,Math.ceil(n/240)):0)+' 分钟';
          });
          
          function refresh(){
           try{
             const s=JSON.parse(Android.getState());
             engineState.textContent=s.engineState||'模型状态未知';
             engineState.className='status '+(s.engineReady?'ok':'warn');
             refText.textContent=s.referenceText||'';
             const refMsg=s.referenceRecorded?'新录音质检已通过，可保存到音色库':(s.hasReference?'当前音色：'+s.activeVoiceName+' · '+Math.round((s.referenceBytes||0)/1024)+' KB':'还没有可用音色');
             refState.textContent=refMsg; refState.className='status '+(s.hasReference||s.referenceRecorded?'ok':'');
             confirmRefBtn.style.display=s.referenceRecorded?'inline-block':'none';
             voiceState.textContent=s.hasReference?'当前选择：'+s.activeVoiceName:'未选择音色'; voiceState.className='status '+(s.hasReference?'ok':'');
             renderVoiceList(s.voiceProfiles||[],s.activeVoiceId||'');
           }catch(e){}
          }
          function saveRecordedVoicePrompt(){
           const name=prompt('给这个音色起个名字','我的声音'); if(!name)return; Android.saveRecordedVoice(name);
          }
          function importVoicePrompt(){
           const m=document.getElementById('impMask');
           document.getElementById('impCount').textContent=countImpText();
           m.classList.add('show');
           setTimeout(()=>document.getElementById('impName').focus(),50);
          }
          function countImpText(){
           const t=document.getElementById('impText').value;
           const han=(t.match(/[\u4e00-\u9fff]/g)||[]).length, words=(t.match(/[A-Za-z]+/g)||[]).length;
           return (han?han+' 个汉字':'')+(han&&words?' + ':'')+(words?words+' 个英文单词':'')||'0 字';
          }
          function closeImport(){document.getElementById('impMask').classList.remove('show')}
          function submitImport(){
           const name=document.getElementById('impName').value.trim(), text=document.getElementById('impText').value.trim();
           if(!name){alert('请填写音色名称');return;}
           if(!text){alert('请填写音频里说出的原文');return;}
           closeImport();
           Android.importVoice(name,text);
          }
          document.addEventListener('input',e=>{if(e.target&&e.target.id==='impText')document.getElementById('impCount').textContent=countImpText()});
          function renderVoiceList(items,activeId){
           if(!items.length){voiceList.innerHTML='<div class="sub">还没有保存音色</div>';return;}
           voiceList.innerHTML=items.map(v=>`<div class="status ${v.id===activeId?'ok':''}" style="margin-top:8px"><b>${v.name}</b><div class="sub">${Math.round((v.bytes||0)/1024)} KB · ${v.id===activeId?'当前使用':'可切换'}</div><div class="row" style="margin-top:8px"><button class="btn" onclick="Android.selectVoice('${v.id}')">使用</button><button class="btn ghost" onclick="Android.playVoice('${v.id}')">试听</button><button class="btn ghost" onclick="deleteVoice('${v.id}','${v.name.replace("'","\'")}')">删除</button></div></div>`).join('');
          }
          function deleteVoice(id,name){if(confirm('删除音色“'+name+'”？'))Android.deleteVoice(id);}
          window.onVoiceLibraryChanged=()=>{refresh();};
          function toggleRecord(){
           if(!recording) Android.startReferenceRecording();
           else Android.stopReferenceRecording();
          }
          window.onRecordingStarted=()=>{
           recording=true; recordBtn.textContent='■ 停止录音'; wave.classList.add('recording');
           refState.textContent='正在录音…完整读完参考句后点“停止录音”';
          };
          window.onRecordingQuality=(sec,rms,clip,silence,dyn)=>{
           recording=false; recordBtn.textContent='● 重新录音'; wave.classList.remove('recording');
           refState.textContent='录音质检通过 · '+sec+'秒 · RMS '+rms+' dB · 爆音 '+clip+'% · 静音 '+silence+'%';
           refState.className='status ok'; confirmRefBtn.style.display='inline-block';
          };
          window.onReferenceConfirmed=()=>{refresh();};
          window.onRecordingError=(m)=>{
           recording=false; recordBtn.textContent='● 开始录音'; wave.classList.remove('recording'); alert(m); refresh();
          };
          function deleteRef(){
           if(confirm('删除当前参考声音并重新录制？')) Android.deleteReference();
          }
          window.onReferenceDeleted=()=>refresh();
          window.onEngineState=(msg,ok)=>{
           engineState.textContent=msg; engineState.className='status '+(ok?'ok':'warn');
          };
          window.onDocumentImported=(name,text)=>{
           script.value=text; script.dispatchEvent(new Event('input'));
           docState.textContent='已导入：'+name+' · '+text.length+' 字符'; docState.className='status ok';
           go('studio');
          };
          window.onImportError=(m)=>alert(m);
          
          function generate(preview){
           const t=script.value.trim();
           if(!t){alert('请先导入或粘贴文字');return}
           genState.textContent='准备本地生成…'; genState.className='status';
           bar.style.width='2%';
           Android.synthesize(t,selected,+intensity.value,preview);
          }
          window.onGenerationProgress=(done,total,msg)=>{
           genState.textContent=msg+' / '+total;
           bar.style.width=Math.max(4,Math.round((done-1)/total*100))+'%';
          };
          window.onGenerationComplete=(count,style)=>{
           genState.textContent='生成完成 · '+style+' · '+count+' 段 · 正在播放';
           genState.className='status ok'; bar.style.width='100%'; refreshHistory();
          };
          window.onGenerationError=(m)=>{
           genState.textContent=m; genState.className='status warn'; bar.style.width='0%'; alert(m);
          };
          window.onGenerationCancelling=()=>{genState.textContent='正在取消生成…';genState.className='status warn';};
          window.onGenerationCancelled=()=>{genState.textContent='已取消生成，旧作品保留';genState.className='status';bar.style.width='0%';};
          window.onPlaybackStarted=()=>{genState.textContent='正在播放本地生成音频…'};
          window.onPlaybackFinished=()=>{genState.textContent='播放完成 ✓';genState.className='status ok'};
          window.onSaved=(name)=>{genState.textContent='WAV 已保存 ✓ · '+name;genState.className='status ok';alert('WAV 已保存：'+name)};
          window.onSaveCancelled=()=>{genState.textContent='已取消保存';};
          
          function refreshHistory(){
           try{
            const items=JSON.parse(Android.listWorks());
            if(!items.length){history.innerHTML='<div class="sub">还没有完整作品</div>';return;}
            history.innerHTML=items.map(w=>{
             const mb=(w.bytes/1024/1024).toFixed(1);
             return `<div class="status" style="margin-top:8px"><div style="font-size:12px;word-break:break-all">${w.name}</div><div class="sub">${mb} MB</div><div class="row" style="margin-top:8px"><button class="btn" onclick="Android.playWork('${w.name}')">播放</button><button class="btn ghost" onclick="Android.saveWork('${w.name}')">另存</button><button class="btn ghost" onclick="Android.deleteWork('${w.name}')">删除</button></div></div>`;
            }).join('');
           }catch(e){history.innerHTML='<div class="sub">历史读取失败</div>';}
          }
          window.onHistoryChanged=()=>refreshHistory();
          
          refresh();
          refreshHistory();
          </script>
