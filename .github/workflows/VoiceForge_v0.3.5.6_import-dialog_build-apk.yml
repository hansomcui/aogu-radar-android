                              runCatching { dest.delete() }
                              js("window.onGenerationError&&window.onGenerationError(${q("导入音色失败（$pickedName）：" + (t.message ?: t.javaClass.simpleName))})")
                          }
                      }
                      return
                  }


                  if (requestCode != REQ_DOC || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  executor.execute {
                      try {
                          val name = getFileName(uri)
                          val lower = name.lowercase(Locale.ROOT)
                          val text = when {
                              lower.endsWith(".docx") -> extractDocx(uri)
                              lower.endsWith(".pdf") -> extractPdf(uri)
                              else -> readText(uri)
                          }
                          js("window.onDocumentImported&&window.onDocumentImported(${q(name)},${q(text)})")
                      } catch (t: Throwable) {
                          js("window.onImportError&&window.onImportError(${q("文档读取失败：" + (t.message ?: t.javaClass.simpleName))})")
                      }
                  }
              }
          
              private fun getFileName(uri: Uri): String {
                  var result = "文档"
                  val c: Cursor? = contentResolver.query(uri, null, null, null, null)
                  c?.use {
                      val idx = it.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx >= 0 && it.moveToFirst()) result = it.getString(idx) ?: result
                  }
                  return result
              }
          
              private fun readText(uri: Uri): String {
                  contentResolver.openInputStream(uri).use { input ->
                      requireNotNull(input) { "无法打开文件" }
                      return input.readBytes().toString(StandardCharsets.UTF_8)
                  }
              }
          
              private fun extractPdf(uri: Uri): String {
                  contentResolver.openInputStream(uri).use { input ->
                      requireNotNull(input) { "无法打开 PDF" }
                      PDDocument.load(input).use { doc ->
                          return PDFTextStripper().getText(doc).trim()
                      }
                  }
              }
          
              private fun extractDocx(uri: Uri): String {
                  contentResolver.openInputStream(uri).use { input ->
                      requireNotNull(input) { "无法打开 DOCX" }
                      ZipInputStream(input).use { zis ->
                          while (true) {
                              val e = zis.nextEntry ?: break
                              if (e.name == "word/document.xml") {
                                  val xml = zis.readBytes().toString(StandardCharsets.UTF_8)
                                  return xml
                                      .replace("</w:p>", "\n")
                                      .replace("</w:tr>", "\n")
                                      .replace("</w:tc>", "\t")
                                      .replace(Regex("<[^>]+>"), "")
                                      .replace("&amp;", "&")
                                      .replace("&lt;", "<")
                                      .replace("&gt;", ">")
                                      .replace("&quot;", "\"")
                                      .replace("&#39;", "'")
                                      .replace(Regex("\n{3,}"), "\n\n")
                                      .trim()
                              }
                          }
                      }
                  }
                  error("DOCX 正文不存在")
              }
          
              private data class WavInfo(
                  val sampleRate: Int,
                  val channels: Int,
                  val bitsPerSample: Int,
                  val dataOffset: Long,
                  val dataSize: Long
              )
          
              private fun readLe16(raf: RandomAccessFile): Int {
                  val b0 = raf.readUnsignedByte()
                  val b1 = raf.readUnsignedByte()
                  return b0 or (b1 shl 8)
              }
          
              private fun readLe32(raf: RandomAccessFile): Long {
                  val b0 = raf.readUnsignedByte().toLong()
                  val b1 = raf.readUnsignedByte().toLong()
                  val b2 = raf.readUnsignedByte().toLong()
                  val b3 = raf.readUnsignedByte().toLong()
                  return b0 or (b1 shl 8) or (b2 shl 16) or (b3 shl 24)
              }
          
              private fun inspectPcm16Wav(file: File): WavInfo {
                  RandomAccessFile(file, "r").use { raf ->
                      require(raf.length() >= 44L) { "WAV 文件太小" }
                      val riff = ByteArray(4); raf.readFully(riff)
                      require(String(riff, Charsets.US_ASCII) == "RIFF") { "WAV 缺少 RIFF 头" }
                      readLe32(raf)
                      val wave = ByteArray(4); raf.readFully(wave)
                      require(String(wave, Charsets.US_ASCII) == "WAVE") { "WAV 缺少 WAVE 标记" }
          
                      var channels = 0
                      var sampleRate = 0
                      var bits = 0
                      var dataOffset = -1L
                      var dataSize = 0L
          
                      while (raf.filePointer + 8 <= raf.length()) {
                          val idb = ByteArray(4); raf.readFully(idb)
                          val id = String(idb, Charsets.US_ASCII)
                          val size = readLe32(raf)
                          val chunkStart = raf.filePointer
                          if (id == "fmt ") {
                              val format = readLe16(raf)
                              channels = readLe16(raf)
                              sampleRate = readLe32(raf).toInt()
                              raf.skipBytes(6)
                              bits = readLe16(raf)
                              require(format == 1) { "只支持 PCM WAV" }
                          } else if (id == "data") {
                              dataOffset = raf.filePointer
                              dataSize = min(size, raf.length() - dataOffset)
                              break
                          }
                          val next = chunkStart + size + (size and 1L)
                          require(next <= raf.length() + 1L) { "WAV chunk 长度异常" }
                          raf.seek(next.coerceAtMost(raf.length()))
                      }
          
                      require(dataOffset >= 0L && dataSize > 0L) { "WAV 缺少有效 data 区" }
                      require(channels == 1) { "当前只支持单声道 WAV" }
                      require(bits == 16) { "当前只支持 PCM16 WAV" }
                      require(sampleRate in 8000..96000) { "WAV 采样率异常：$sampleRate" }
                      require(dataSize % 2L == 0L) { "PCM16 data 长度异常" }
                      return WavInfo(sampleRate, channels, bits, dataOffset, dataSize)
                  }
              }
          
              private fun stopPlayback() {
                  playbackToken.incrementAndGet()
                  val old = audioTrack
                  audioTrack = null
                  runCatching { old?.pause() }
                  runCatching { old?.flush() }
                  runCatching { old?.stop() }
                  runCatching { old?.release() }
              }
          
              private fun playFile(file: File) {
                  stopPlayback()
                  val myToken = playbackToken.get()
          
                  Thread {
                      var localTrack: AudioTrack? = null
                      try {
                          val info = inspectPcm16Wav(file)
                          val minBuffer = AudioTrack.getMinBufferSize(
                              info.sampleRate,
                              AudioFormat.CHANNEL_OUT_MONO,
                              AudioFormat.ENCODING_PCM_16BIT
                          )
                          check(minBuffer > 0) { "AudioTrack 无法创建缓冲区：$minBuffer" }
          
                          val track = AudioTrack.Builder()
                              .setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_MEDIA)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build()
                              )
                              .setAudioFormat(
                                  AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(info.sampleRate)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build()
                              )
                              .setBufferSizeInBytes(max(minBuffer, 32768))
                              .setTransferMode(AudioTrack.MODE_STREAM)
                              .build()
          
                          check(track.state == AudioTrack.STATE_INITIALIZED) { "AudioTrack 初始化失败" }
                          localTrack = track
                          audioTrack = track
                          track.play()
                          js("window.onPlaybackStarted&&window.onPlaybackStarted()")
          
                          RandomAccessFile(file, "r").use { raf ->
                              raf.seek(info.dataOffset)
                              var remaining = info.dataSize
                              val buffer = ByteArray(32768)
                              while (remaining > 0L && playbackToken.get() == myToken && !shuttingDown) {
                                  val want = min(buffer.size.toLong(), remaining).toInt()
                                  val n = raf.read(buffer, 0, want)
                                  if (n <= 0) break
                                  var offset = 0
                                  while (offset < n && playbackToken.get() == myToken && !shuttingDown) {
                                      val written = track.write(buffer, offset, n - offset, AudioTrack.WRITE_BLOCKING)
                                      if (written < 0) error("AudioTrack.write 失败：$written")
                                      if (written == 0) Thread.sleep(5) else offset += written
                                  }
                                  remaining -= n
                              }
                          }
          
                          if (playbackToken.get() == myToken && !shuttingDown) {
                              Thread.sleep(180L)
                              if (playbackToken.get() == myToken && !shuttingDown) {
                                  js("window.onPlaybackFinished&&window.onPlaybackFinished()")
                              }
                          }
                      } catch (t: Throwable) {
                          if (playbackToken.get() == myToken && !shuttingDown) {
                              js("window.onGenerationError&&window.onGenerationError(${q("播放失败：" + (t.message ?: t.javaClass.simpleName))})")
                          }
                      } finally {
                          if (audioTrack === localTrack) audioTrack = null
                          runCatching { localTrack?.pause() }
                          runCatching { localTrack?.flush() }
                          runCatching { localTrack?.stop() }
                          runCatching { localTrack?.release() }
                      }
                  }.apply {
                      name = "VoiceForgeAudioTrack"
                      isDaemon = true
                      start()
                  }
              }
          
          private fun js(script: String) {
                  if (shuttingDown) return
                  runOnUiThread {
                      if (!shuttingDown) runCatching { webView.evaluateJavascript(script, null) }
                  }
              }
          
              private fun q(s: String): String = JSONObject.quote(s)
          
              private fun toast(s: String) {
                  runOnUiThread { Toast.makeText(this, s, Toast.LENGTH_LONG).show() }
              }
          
              private fun friendly(t: Throwable): String {
                  val m = t.message ?: t.javaClass.simpleName
                  return when {
                      m.contains("memory", true) || m.contains("alloc", true) ->
                          "手机内存不足。请关闭其他大型应用后再试，或缩短一次生成的文字。"
                      m.contains("reference", true) ->
                          "参考声音或参考文字不符合 ZipVoice 要求，请重新录制并完整读出屏幕上的参考句。"
                      else -> m.take(500)
                  }
              }
          
              private fun littleInt(b: ByteArray, o: Int): Int =
                  (b[o].toInt() and 0xff) or
                      ((b[o + 1].toInt() and 0xff) shl 8) or
                      ((b[o + 2].toInt() and 0xff) shl 16) or
                      ((b[o + 3].toInt() and 0xff) shl 24)
          
              private fun littleShort(b: ByteArray, o: Int): Int =
                  (b[o].toInt() and 0xff) or ((b[o + 1].toInt() and 0xff) shl 8)
          
              private fun writeLE16(out: FileOutputStream, v: Int) {
                  out.write(v and 0xff); out.write((v shr 8) and 0xff)
              }
          
              private fun writeLE32(out: FileOutputStream, v: Int) {
                  out.write(v and 0xff); out.write((v shr 8) and 0xff)
                  out.write((v shr 16) and 0xff); out.write((v shr 24) and 0xff)
              }
          
              override fun onDestroy() {
                  shuttingDown = true
                  generationCancel.set(true)
                  stopRecorder()
                  stopPlayback()
                  executor.shutdown()
                  val engine = tts
                  Thread {
                      val stopped = runCatching { executor.awaitTermination(10, TimeUnit.SECONDS) }.getOrDefault(false)
                      if (stopped) {
                          runCatching { engine?.release() }
                      } else {
                          executor.shutdownNow()
                          // Do not release a native engine that may still be inside a synthesis call.
                          // The process will reclaim it safely after activity teardown.
                      }
                  }.start()
                  webView.destroy()
                  super.onDestroy()
              }
          }
