              <div class="card">
                <h2>当前音色</h2><div id="voiceState" class="status">未选择</div>
                <div class="row" style="margin-top:12px"><button class="btn" onclick="go('home')">＋ 录制新音色</button><button class="btn gold" onclick="importVoicePrompt()">＋ 导入音色（WAV/MP3/MP4）</button></div>
              </div>
