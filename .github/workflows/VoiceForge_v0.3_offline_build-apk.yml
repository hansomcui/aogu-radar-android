name: Build VoiceForge v0.3 Offline APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/VoiceForge_v0.3_offline_build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/hansom/voiceforge app/src/main/assets app/src/main/res/values app/src/main/res/drawable app/libs
          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.name = "VoiceForgeOffline"
          include(":app")
          EOF_SETTINGS

          cat > build.gradle <<'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF_ROOT

          cat > gradle.properties <<'EOF_PROPS'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF_PROPS

          cat > app/build.gradle <<'EOF_APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          
          android {
              namespace 'com.hansom.voiceforge'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.hansom.voiceforge"
                  minSdk 26
                  targetSdk 34
                  versionCode 30
                  versionName "0.3.0"
                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }
          
              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          
              kotlinOptions {
                  jvmTarget = '17'
              }
          
              androidResources {
                  noCompress += ['onnx', 'txt', 'bin']
              }
          }
          
          dependencies {
              implementation files('libs/sherpa-onnx-1.13.8.aar')
              implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
          }
          EOF_APP

          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
          
              <application
                  android:allowBackup="true"
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat > app/src/main/java/com/hansom/voiceforge/MainActivity.kt <<'EOF_KT'
          package com.hansom.voiceforge
          
          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.database.Cursor
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaPlayer
          import android.media.MediaRecorder
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import com.k2fsa.sherpa.onnx.GenerationConfig
          import com.k2fsa.sherpa.onnx.OfflineTts
          import com.k2fsa.sherpa.onnx.OfflineTtsConfig
          import com.k2fsa.sherpa.onnx.OfflineTtsModelConfig
          import com.k2fsa.sherpa.onnx.OfflineTtsZipVoiceModelConfig
          import com.tom_roush.pdfbox.android.PDFBoxResourceLoader
          import com.tom_roush.pdfbox.pdmodel.PDDocument
          import com.tom_roush.pdfbox.text.PDFTextStripper
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.InputStream
          import java.io.RandomAccessFile
          import java.nio.charset.StandardCharsets
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.zip.ZipInputStream
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.tanh
          
          class MainActivity : Activity() {
              companion object {
                  private const val REQ_MIC = 500
                  private const val REQ_DOC = 501
                  private const val SAMPLE_RATE = 24000
                  private const val MODEL_ASSET_DIR = "zipvoice"
                  private const val MODEL_VERSION = "zipvoice-int8-zh-en-v1"
                  private const val REF_FILE = "my_voice_reference.wav"
          
                  // The user should read this exact sentence while recording.
                  private const val REFERENCE_TEXT =
                      "今天我用自己平时最自然的声音，读这一小段话。声音里有我的语气、节奏和呼吸，也有我平常说话时自然的停顿。以后无论读什么文字，都请保持是我的声音。"
              }
          
              private lateinit var webView: WebView
              private val executor = Executors.newSingleThreadExecutor()
              private val recording = AtomicBoolean(false)
              private var recorder: AudioRecord? = null
              private var recordThread: Thread? = null
              private var player: MediaPlayer? = null
              private var tts: OfflineTts? = null
          
              @Volatile private var engineReady = false
              @Volatile private var engineState = "首次启动：正在准备本地模型"
              @Volatile private var currentGenerated: File? = null
          
              private val referenceFile: File by lazy { File(filesDir, REF_FILE) }
              private val modelDir: File by lazy { File(filesDir, "models/zipvoice") }
          
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = android.graphics.Color.rgb(11, 11, 12)
                  window.navigationBarColor = android.graphics.Color.rgb(11, 11, 12)
                  PDFBoxResourceLoader.init(applicationContext)
          
                  webView = WebView(this)
                  setContentView(webView)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mediaPlaybackRequiresUserGesture = false
                      defaultTextEncodingName = "utf-8"
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.addJavascriptInterface(Bridge(), "Android")
                  webView.loadUrl("file:///android_asset/index.html")
          
                  executor.execute { prepareEngine() }
              }
          
              inner class Bridge {
                  @JavascriptInterface
                  fun getState(): String {
                      val o = JSONObject()
                      o.put("engineReady", engineReady)
                      o.put("engineState", engineState)
                      o.put("hasReference", referenceFile.isFile && referenceFile.length() > 1000)
                      o.put("referenceText", REFERENCE_TEXT)
                      o.put("referenceBytes", if (referenceFile.isFile) referenceFile.length() else 0)
                      o.put("hasGenerated", currentGenerated?.isFile == true)
                      return o.toString()
                  }
          
                  @JavascriptInterface
                  fun startReferenceRecording() {
                      runOnUiThread {
                          if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), REQ_MIC)
                          } else {
                              startRecorder()
                          }
                      }
                  }
          
                  @JavascriptInterface
                  fun stopReferenceRecording() {
                      stopRecorder()
                  }
          
                  @JavascriptInterface
                  fun playReference() {
                      runOnUiThread {
                          if (!referenceFile.isFile) {
                              toast("还没有录制参考声音")
                          } else {
                              playFile(referenceFile)
                          }
                      }
                  }
          
                  @JavascriptInterface
                  fun deleteReference() {
                      stopRecorder()
                      if (referenceFile.exists()) referenceFile.delete()
                      js("window.onReferenceDeleted&&window.onReferenceDeleted()")
                  }
          
                  @JavascriptInterface
                  fun pickDocument() {
                      runOnUiThread {
                          val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                              putExtra(
                                  Intent.EXTRA_MIME_TYPES,
                                  arrayOf(
                                      "text/plain",
                                      "text/markdown",
                                      "application/pdf",
                                      "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                                  )
                              )
                          }
                          startActivityForResult(i, REQ_DOC)
                      }
                  }
          
                  @JavascriptInterface
                  fun synthesize(text: String?, style: String?, intensity: Int, preview: Boolean) {
                      val clean = text?.trim().orEmpty()
                      if (clean.isEmpty()) {
                          js("window.onGenerationError&&window.onGenerationError('请先导入或粘贴文字')")
                          return
                      }
                      if (!engineReady) {
                          js("window.onGenerationError&&window.onGenerationError(${q(engineState)})")
                          return
                      }
                      if (!referenceFile.isFile) {
                          js("window.onGenerationError&&window.onGenerationError('请先录制“我的音色”参考句')")
                          return
                      }
                      executor.execute {
                          try {
                              synthesizeOffline(clean, style ?: "深沉克制", intensity.coerceIn(0, 100), preview)
                          } catch (t: Throwable) {
                              js("window.onGenerationError&&window.onGenerationError(${q(friendly(t))})")
                          }
                      }
                  }
          
                  @JavascriptInterface
                  fun replayGenerated() {
                      runOnUiThread {
                          val f = currentGenerated
                          if (f == null || !f.isFile) toast("还没有生成音频") else playFile(f)
                      }
                  }
          
                  @JavascriptInterface
                  fun stopAudio() {
                      runOnUiThread {
                          player?.runCatching { stop() }
                          player?.release()
                          player = null
                      }
                  }
          
                  @JavascriptInterface
                  fun saveGenerated() {
                      val f = currentGenerated
                      if (f == null || !f.isFile) {
                          toast("还没有生成音频")
                          return
                      }
                      executor.execute {
                          try {
                              val name = "VoiceForge-${System.currentTimeMillis()}.wav"
                              val values = ContentValues().apply {
                                  put(MediaStore.Audio.Media.DISPLAY_NAME, name)
                                  put(MediaStore.Audio.Media.MIME_TYPE, "audio/wav")
                                  put(MediaStore.Audio.Media.RELATIVE_PATH, "Music/VoiceForge")
                                  put(MediaStore.Audio.Media.IS_PENDING, 1)
                              }
                              val uri = contentResolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values)
                                  ?: error("无法创建音频文件")
                              contentResolver.openOutputStream(uri)?.use { out ->
                                  FileInputStream(f).use { input -> input.copyTo(out) }
                              } ?: error("无法写入音频文件")
                              values.clear()
                              values.put(MediaStore.Audio.Media.IS_PENDING, 0)
                              contentResolver.update(uri, values, null, null)
                              js("window.onSaved&&window.onSaved(${q(name)})")
                          } catch (t: Throwable) {
                              js("window.onGenerationError&&window.onGenerationError(${q("保存失败：" + (t.message ?: t.javaClass.simpleName))})")
                          }
                      }
                  }
              }
          
              private data class StyleCfg(
                  val speed: Float,
                  val silenceScale: Float,
                  val gain: Float,
                  val tone: Float,
                  val chunkGapMs: Int,
                  val numSteps: Int
              )
          
              private fun styleFor(name: String, intensity: Int): StyleCfg {
                  val k = intensity / 100f
                  val target = when (name) {
                      "机智勇敢" -> StyleCfg(1.10f, 0.72f, 1.04f, -0.12f, 90, 4)
                      "深情慈悲" -> StyleCfg(0.90f, 1.18f, 0.96f, 0.18f, 260, 5)
                      "嚣张跋扈" -> StyleCfg(0.96f, 0.72f, 1.13f, -0.08f, 120, 5)
                      "风流倜傥" -> StyleCfg(1.03f, 0.82f, 1.00f, 0.06f, 120, 4)
                      "雄浑壮烈" -> StyleCfg(0.86f, 1.25f, 1.16f, 0.14f, 320, 6)
                      else -> StyleCfg(0.84f, 1.22f, 0.94f, 0.12f, 300, 5)
                  }
                  fun mix(neutral: Float, v: Float) = neutral + (v - neutral) * k
                  return target.copy(
                      speed = mix(1f, target.speed),
                      silenceScale = mix(1f, target.silenceScale),
                      gain = mix(1f, target.gain),
                      tone = target.tone * k,
                      chunkGapMs = (120 + (target.chunkGapMs - 120) * k).toInt()
                  )
              }
          
              private fun transformText(text: String, style: String, intensity: Int): String {
                  if (intensity < 20) return text
                  return when (style) {
                      "机智勇敢" -> text.replace("……", "。").replace("；", "，")
                      "深情慈悲" -> text.replace("！", "。").replace("?", "？")
                      "嚣张跋扈" -> text.replace("。", "！")
                      "风流倜傥" -> text.replace("；", "，")
                      "雄浑壮烈" -> text.replace("；", "。").replace("：", "——")
                      else -> text.replace("；", "。")
                  }
              }
          
              private fun synthesizeOffline(raw: String, style: String, intensity: Int, preview: Boolean) {
                  val localTts = tts ?: error("本地模型尚未加载完成")
                  val ref = readOwnWav(referenceFile)
                  val cfg = styleFor(style, intensity)
                  var source = if (preview) previewText(raw) else raw
                  source = transformText(source, style, intensity)
                  val chunks = splitText(source, if (preview) 120 else 180)
                  if (chunks.isEmpty()) error("没有可生成的文字")
          
                  val outDir = File(filesDir, "generated").apply { mkdirs() }
                  val outFile = File(outDir, if (preview) "preview.wav" else "latest.wav")
                  if (outFile.exists()) outFile.delete()
          
                  WavStreamWriter(outFile, SAMPLE_RATE).use { writer ->
                      chunks.forEachIndexed { index, chunk ->
                          js("window.onGenerationProgress&&window.onGenerationProgress(${index + 1},${chunks.size},${q("本地生成第 ${index + 1} 段")})")
                          val gc = GenerationConfig(
                              silenceScale = cfg.silenceScale,
                              speed = cfg.speed,
                              sid = 0,
                              referenceAudio = ref.samples,
                              referenceSampleRate = ref.sampleRate,
                              referenceText = REFERENCE_TEXT,
                              numSteps = cfg.numSteps,
                              extra = mapOf("min_char_in_sentence" to "2")
                          )
                          val audio = localTts.generateWithConfig(text = chunk, config = gc)
                          writer.append(postProcess(audio.samples, cfg.gain, cfg.tone))
                          writer.appendSilence(cfg.chunkGapMs)
                      }
                  }
          
                  currentGenerated = outFile
                  js("window.onGenerationComplete&&window.onGenerationComplete(${chunks.size},${q(style)})")
                  runOnUiThread { playFile(outFile) }
              }
          
              private fun postProcess(input: FloatArray, gain: Float, tone: Float): FloatArray {
                  val out = FloatArray(input.size)
                  var prev = 0f
                  for (i in input.indices) {
                      val x = input[i]
                      val shaped = if (tone >= 0f) {
                          // Small low-pass blend: warmer/rounder.
                          val y = x * (1f - tone.coerceIn(0f, 0.35f)) + prev * tone.coerceIn(0f, 0.35f)
                          prev = y
                          y
                      } else {
                          // Small high-frequency emphasis: sharper/more forward.
                          val a = (-tone).coerceIn(0f, 0.25f)
                          val y = x + a * (x - prev)
                          prev = x
                          y
                      }
                      out[i] = tanh((shaped * gain).toDouble()).toFloat().coerceIn(-0.99f, 0.99f)
                  }
                  return out
              }
          
              private fun prepareEngine() {
                  try {
                      engineState = "首次启动：正在释放本地 ZipVoice 模型"
                      js("window.onEngineState&&window.onEngineState(${q(engineState)},false)")
                      val marker = File(modelDir, ".ready-$MODEL_VERSION")
                      if (!marker.isFile) {
                          if (modelDir.exists()) modelDir.deleteRecursively()
                          modelDir.mkdirs()
                          copyAssetTree(MODEL_ASSET_DIR, modelDir)
                          marker.writeText("ok")
                      }
          
                      val required = listOf(
                          "encoder.int8.onnx",
                          "decoder.int8.onnx",
                          "vocos_24khz.onnx",
                          "tokens.txt",
                          "lexicon.txt"
                      )
                      required.forEach { name ->
                          check(File(modelDir, name).isFile) { "模型文件缺失：$name" }
                      }
                      check(File(modelDir, "espeak-ng-data").isDirectory) { "模型目录缺失：espeak-ng-data" }
          
                      engineState = "正在加载本地声音模型"
                      js("window.onEngineState&&window.onEngineState(${q(engineState)},false)")
                      val zip = OfflineTtsZipVoiceModelConfig(
                          tokens = File(modelDir, "tokens.txt").absolutePath,
                          encoder = File(modelDir, "encoder.int8.onnx").absolutePath,
                          decoder = File(modelDir, "decoder.int8.onnx").absolutePath,
                          vocoder = File(modelDir, "vocos_24khz.onnx").absolutePath,
                          dataDir = File(modelDir, "espeak-ng-data").absolutePath,
                          lexicon = File(modelDir, "lexicon.txt").absolutePath
                      )
                      val modelCfg = OfflineTtsModelConfig(
                          zipvoice = zip,
                          numThreads = Runtime.getRuntime().availableProcessors().coerceIn(2, 4),
                          debug = false,
                          provider = "cpu"
                      )
                      val fullCfg = OfflineTtsConfig(
                          model = modelCfg,
                          maxNumSentences = 1,
                          silenceScale = 1f
                      )
                      tts = OfflineTts(assetManager = null, config = fullCfg)
                      val sr = tts?.sampleRate() ?: 0
                      check(sr > 0) { "模型加载后采样率无效" }
                      engineReady = true
                      engineState = "本地 ZipVoice 已就绪 · ${sr}Hz · 完全离线"
                      js("window.onEngineState&&window.onEngineState(${q(engineState)},true)")
                  } catch (t: Throwable) {
                      engineReady = false
                      engineState = "本地模型初始化失败：" + friendly(t)
                      js("window.onEngineState&&window.onEngineState(${q(engineState)},false)")
                  }
              }
          
              private fun copyAssetTree(assetPath: String, dest: File) {
                  val list = assets.list(assetPath) ?: emptyArray()
                  if (list.isEmpty()) {
                      dest.parentFile?.mkdirs()
                      assets.open(assetPath).use { input ->
                          FileOutputStream(dest).use { output -> input.copyTo(output, 1024 * 1024) }
                      }
                      return
                  }
                  dest.mkdirs()
                  list.forEach { child ->
                      copyAssetTree("$assetPath/$child", File(dest, child))
                  }
              }
          
              private fun startRecorder() {
                  if (recording.get()) return
                  val minBuffer = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )
                  if (minBuffer <= 0) {
                      toast("当前设备无法建立 24kHz 录音")
                      return
                  }
                  val ar = AudioRecord(
                      MediaRecorder.AudioSource.VOICE_RECOGNITION,
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                      max(minBuffer, 8192)
                  )
                  if (ar.state != AudioRecord.STATE_INITIALIZED) {
                      ar.release()
                      toast("麦克风初始化失败")
                      return
                  }
                  recorder = ar
                  recording.set(true)
                  ar.startRecording()
                  js("window.onRecordingStarted&&window.onRecordingStarted()")
          
                  recordThread = Thread {
                      val raw = ByteArrayOutputStream()
                      val buf = ShortArray(4096)
                      var totalSamples = 0L
                      try {
                          while (recording.get()) {
                              val n = ar.read(buf, 0, buf.size)
                              if (n > 0) {
                                  for (i in 0 until n) {
                                      val v = buf[i].toInt()
                                      raw.write(v and 0xff)
                                      raw.write((v shr 8) and 0xff)
                                  }
                                  totalSamples += n
                                  if (totalSamples >= SAMPLE_RATE * 30L) {
                                      recording.set(false)
                                      runOnUiThread { runCatching { ar.stop() } }
                                  }
                              }
                          }
                      } finally {
                          runCatching { ar.stop() }
                          runCatching { ar.release() }
                          recorder = null
                          val seconds = totalSamples.toDouble() / SAMPLE_RATE
                          if (seconds >= 5.0) {
                              writePcm16Wav(referenceFile, raw.toByteArray(), SAMPLE_RATE)
                              js("window.onRecordingStopped&&window.onRecordingStopped(${String.format(Locale.US, "%.1f", seconds)})")
                          } else {
                              referenceFile.delete()
                              js("window.onRecordingError&&window.onRecordingError('录音太短，请完整读完参考句，至少 5 秒')")
                          }
                      }
                  }.also {
                      it.name = "VoiceForgeRecorder"
                      it.start()
                  }
              }
          
              private fun stopRecorder() {
                  recording.set(false)
                  runCatching { recorder?.stop() }
              }
          
              private data class WavData(val sampleRate: Int, val samples: FloatArray)
          
              private fun readOwnWav(file: File): WavData {
                  val data = file.readBytes()
                  require(data.size >= 44) { "参考音频损坏" }
                  require(String(data, 0, 4, Charsets.US_ASCII) == "RIFF") { "参考音频不是 WAV" }
                  val sr = littleInt(data, 24)
                  val bits = littleShort(data, 34)
                  require(bits == 16) { "参考音频必须是 PCM16" }
                  var pos = 12
                  var dataOffset = -1
                  var dataSize = 0
                  while (pos + 8 <= data.size) {
                      val id = String(data, pos, 4, Charsets.US_ASCII)
                      val size = littleInt(data, pos + 4)
                      if (id == "data") {
                          dataOffset = pos + 8
                          dataSize = min(size, data.size - dataOffset)
                          break
                      }
                      pos += 8 + size + (size and 1)
                  }
                  require(dataOffset >= 0) { "参考 WAV 缺少 data 区" }
                  val count = dataSize / 2
                  val samples = FloatArray(count)
                  var p = dataOffset
                  for (i in 0 until count) {
                      val lo = data[p].toInt() and 0xff
                      val hi = data[p + 1].toInt()
                      val s = ((hi shl 8) or lo).toShort()
                      samples[i] = s / 32768f
                      p += 2
                  }
                  return WavData(sr, samples)
              }
          
              private fun writePcm16Wav(file: File, pcm: ByteArray, sampleRate: Int) {
                  FileOutputStream(file).use { out ->
                      val dataSize = pcm.size
                      out.write("RIFF".toByteArray(Charsets.US_ASCII))
                      writeLE32(out, 36 + dataSize)
                      out.write("WAVEfmt ".toByteArray(Charsets.US_ASCII))
                      writeLE32(out, 16)
                      writeLE16(out, 1)
                      writeLE16(out, 1)
                      writeLE32(out, sampleRate)
                      writeLE32(out, sampleRate * 2)
                      writeLE16(out, 2)
                      writeLE16(out, 16)
                      out.write("data".toByteArray(Charsets.US_ASCII))
                      writeLE32(out, dataSize)
                      out.write(pcm)
                  }
              }
          
              private class WavStreamWriter(private val file: File, private val sampleRate: Int) : AutoCloseable {
                  private val raf = RandomAccessFile(file, "rw")
                  private var sampleCount = 0L
                  init {
                      raf.setLength(0)
                      repeat(44) { raf.write(0) }
                  }
                  fun append(samples: FloatArray) {
                      samples.forEach { f ->
                          val s = (f.coerceIn(-1f, 1f) * 32767f).toInt().toShort().toInt()
                          raf.write(s and 0xff)
                          raf.write((s shr 8) and 0xff)
                          sampleCount++
                      }
                  }
                  fun appendSilence(ms: Int) {
                      val n = (sampleRate * ms / 1000.0).toInt()
                      repeat(n) {
                          raf.write(0)
                          raf.write(0)
                          sampleCount++
                      }
                  }
                  override fun close() {
                      val dataSize = (sampleCount * 2L).toInt()
                      raf.seek(0)
                      raf.writeBytes("RIFF")
                      writeLE32(raf, 36 + dataSize)
                      raf.writeBytes("WAVEfmt ")
                      writeLE32(raf, 16)
                      writeLE16(raf, 1)
                      writeLE16(raf, 1)
                      writeLE32(raf, sampleRate)
                      writeLE32(raf, sampleRate * 2)
                      writeLE16(raf, 2)
                      writeLE16(raf, 16)
                      raf.writeBytes("data")
                      writeLE32(raf, dataSize)
                      raf.close()
                  }
                  companion object {
                      private fun writeLE16(r: RandomAccessFile, v: Int) {
                          r.write(v and 0xff); r.write((v shr 8) and 0xff)
                      }
                      private fun writeLE32(r: RandomAccessFile, v: Int) {
                          r.write(v and 0xff); r.write((v shr 8) and 0xff)
                          r.write((v shr 16) and 0xff); r.write((v shr 24) and 0xff)
                      }
                  }
              }
          
              private fun splitText(text: String, maxChars: Int): List<String> {
                  val normalized = text.replace("\r", "").trim()
                  if (normalized.isEmpty()) return emptyList()
                  val out = mutableListOf<String>()
                  val buf = StringBuilder()
                  fun flush() {
                      val s = buf.toString().trim()
                      if (s.isNotEmpty()) out += s
                      buf.clear()
                  }
                  for (c in normalized) {
                      buf.append(c)
                      val boundary = c in charArrayOf('。', '！', '？', '!', '?', '；', ';', '\n')
                      if ((boundary && buf.length >= 30) || buf.length >= maxChars) flush()
                  }
                  flush()
                  return out
              }
          
              private fun previewText(text: String): String {
                  val t = text.trim()
                  if (t.length <= 100) return t
                  var end = min(120, t.length)
                  for (i in min(120, t.length - 1) downTo 55) {
                      if (t[i] in charArrayOf('。', '！', '？', '!', '?', '；', ';')) {
                          end = i + 1
                          break
                      }
                  }
                  return t.substring(0, end)
              }
          
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == REQ_MIC && grantResults.firstOrNull() == PackageManager.PERMISSION_GRANTED) {
                      startRecorder()
                  } else if (requestCode == REQ_MIC) {
                      toast("需要麦克风权限才能建立你的本地音色")
                  }
              }
          
              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != REQ_DOC || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  executor.execute {
                      try {
                          val name = getFileName(uri)
                          val lower = name.lowercase(Locale.ROOT)
                          val text = when {
                              lower.endsWith(".docx") -> extractDocx(uri)
                              lower.endsWith(".pdf") -> extractPdf(uri)
                              else -> readText(uri)
                          }
                          js("window.onDocumentImported&&window.onDocumentImported(${q(name)},${q(text)})")
                      } catch (t: Throwable) {
                          js("window.onImportError&&window.onImportError(${q("文档读取失败：" + (t.message ?: t.javaClass.simpleName))})")
                      }
                  }
              }
          
              private fun getFileName(uri: Uri): String {
                  var result = "文档"
                  val c: Cursor? = contentResolver.query(uri, null, null, null, null)
                  c?.use {
                      val idx = it.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx >= 0 && it.moveToFirst()) result = it.getString(idx) ?: result
                  }
                  return result
              }
          
              private fun readText(uri: Uri): String {
                  contentResolver.openInputStream(uri).use { input ->
                      requireNotNull(input) { "无法打开文件" }
                      return input.readBytes().toString(StandardCharsets.UTF_8)
                  }
              }
          
              private fun extractPdf(uri: Uri): String {
                  contentResolver.openInputStream(uri).use { input ->
                      requireNotNull(input) { "无法打开 PDF" }
                      PDDocument.load(input).use { doc ->
                          return PDFTextStripper().getText(doc).trim()
                      }
                  }
              }
          
              private fun extractDocx(uri: Uri): String {
                  contentResolver.openInputStream(uri).use { input ->
                      requireNotNull(input) { "无法打开 DOCX" }
                      ZipInputStream(input).use { zis ->
                          while (true) {
                              val e = zis.nextEntry ?: break
                              if (e.name == "word/document.xml") {
                                  val xml = zis.readBytes().toString(StandardCharsets.UTF_8)
                                  return xml
                                      .replace("</w:p>", "\n")
                                      .replace("</w:tr>", "\n")
                                      .replace("</w:tc>", "\t")
                                      .replace(Regex("<[^>]+>"), "")
                                      .replace("&amp;", "&")
                                      .replace("&lt;", "<")
                                      .replace("&gt;", ">")
                                      .replace("&quot;", "\"")
                                      .replace("&#39;", "'")
                                      .replace(Regex("\n{3,}"), "\n\n")
                                      .trim()
                              }
                          }
                      }
                  }
                  error("DOCX 正文不存在")
              }
          
              private fun playFile(file: File) {
                  try {
                      player?.release()
                      player = MediaPlayer().apply {
                          setDataSource(file.absolutePath)
                          prepare()
                          setOnCompletionListener {
                              js("window.onPlaybackFinished&&window.onPlaybackFinished()")
                          }
                          start()
                      }
                      js("window.onPlaybackStarted&&window.onPlaybackStarted()")
                  } catch (t: Throwable) {
                      toast("播放失败：" + (t.message ?: t.javaClass.simpleName))
                  }
              }
          
              private fun js(script: String) {
                  runOnUiThread { webView.evaluateJavascript(script, null) }
              }
          
              private fun q(s: String): String = JSONObject.quote(s)
          
              private fun toast(s: String) {
                  runOnUiThread { Toast.makeText(this, s, Toast.LENGTH_LONG).show() }
              }
          
              private fun friendly(t: Throwable): String {
                  val m = t.message ?: t.javaClass.simpleName
                  return when {
                      m.contains("memory", true) || m.contains("alloc", true) ->
                          "手机内存不足。请关闭其他大型应用后再试，或缩短一次生成的文字。"
                      m.contains("reference", true) ->
                          "参考声音或参考文字不符合 ZipVoice 要求，请重新录制并完整读出屏幕上的参考句。"
                      else -> m.take(500)
                  }
              }
          
              private fun littleInt(b: ByteArray, o: Int): Int =
                  (b[o].toInt() and 0xff) or
                      ((b[o + 1].toInt() and 0xff) shl 8) or
                      ((b[o + 2].toInt() and 0xff) shl 16) or
                      ((b[o + 3].toInt() and 0xff) shl 24)
          
              private fun littleShort(b: ByteArray, o: Int): Int =
                  (b[o].toInt() and 0xff) or ((b[o + 1].toInt() and 0xff) shl 8)
          
              private fun writeLE16(out: FileOutputStream, v: Int) {
                  out.write(v and 0xff); out.write((v shr 8) and 0xff)
              }
          
              private fun writeLE32(out: FileOutputStream, v: Int) {
                  out.write(v and 0xff); out.write((v shr 8) and 0xff)
                  out.write((v shr 16) and 0xff); out.write((v shr 24) and 0xff)
              }
          
              override fun onDestroy() {
                  stopRecorder()
                  runCatching { player?.release() }
                  runCatching { tts?.release() }
                  executor.shutdownNow()
                  webView.destroy()
                  super.onDestroy()
              }
          }
